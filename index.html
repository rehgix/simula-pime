ordaHores":"Recordeu assignar-li hores a Producció › Hores de treball.","pro.curs":"En desenvolupament","pro.capCurs":"Cap.","pro.progres":"Fet: {p} · Pendent: {h} h","pro.acabats":"Acabats","pro.capAcabats":"Encara cap.","pro.ingres":"Ingressos de la darrera ronda: {x}","pro.valorAra":"Valor de venda ara: {x}","pro.vendre":"Vendre'l aquesta ronda","aviso.adjudicat":"Us han adjudicat l'encàrrec «{nom}» per {preu}.","aviso.lliurat":"Heu lliurat «{nom}» a temps i heu cobrat {x}.","aviso.lliuratTard":"Heu lliurat «{nom}» amb {n} rondes de retard: el client descompta {x} i la vostra reputació baixa.","aviso.endarrerit":"«{nom}» està fora de termini i encara no s'ha lliurat.","aviso.propiAcabat":"Heu acabat el projecte propi «{nom}». A partir d'ara el podeu vendre o mantenir perquè doni ingressos.","aviso.propiVenut":"Heu venut «{nom}» per {x}.","c.ventasTienda":"Vendes i serveis del dia a dia","c.ventasProyectos":"Encàrrecs adjudicats","c.descuentosRetraso":"Descomptes per lliuraments amb retard","c.monetizacion":"Ingressos de projectes propis","c.ventaPropios":"Venda de projectes propis","c.deudores":"Clients (pendent de cobrament)","cie.pressupostos":"Pressupostos presentats","cie.hores":"Hores a projectes","cie.iniciar":"Projectes que comenceu","cie.vendre":"Projectes que veneu","cie.horesV":"{a} de {d} h","res.horas":"Hores per a projectes","cand.contrato":"Tipus de contracte","contrato.indefinido":"Indefinit","contrato.temporal":"Temporal (3 mesos)","contrato.indefinido.h":"Dona més seguretat i motivació. Acomiadar costa un mes i mig de sou.","contrato.temporal.h":"S'acaba sol als 3 mesos (amb 12 dies de sou per any treballat), però motiva una mica menys.","cand.previsto2":"Contractació prevista ({c}): s'incorpora en tancar la ronda amb un sou de {x}.","pla.contrato.indefinido":"Contracte indefinit","pla.contrato.temporal":"Contracte temporal · queden {n} mesos","pla.contrato.ultimo":"Contracte temporal · s'acaba aquest mes","pla.convertir":"Fer-lo indefinit","pla.convertido":"Passarà a indefinit en tancar la ronda.","pla.finAviso":"Si no el feu indefinit, marxarà de l'empresa en acabar aquest mes.","pla.sinPrl":"Sense formació en PRL","pla.conPrl":"Formació en PRL feta","pla.vacaciones":"Vacances: {d} dies acumulats","pla.hacerVacaciones":"Vacances aquest mes (2 setmanes)","pla.vacacionesPocas":"Calen 10 dies acumulats per fer vacances.","pla.vacacionesH":"Aquest mes treballarà la meitat, però tornarà amb més motivació.","pla.verNomina":"Veure la nòmina","pla.ocultarNomina":"Amagar la nòmina","curso.prl":"Prevenció de riscos (PRL)","curso.prl.h":"{x}. Obligatòria per llei. Redueix molt el risc d'accident i evita multes. Ocupa un 5 % del temps d'aquest mes.","nom.titulo":"Nòmina de {mes} (aproximada)","nom.devengos":"Meritacions","nom.bruto":"Salari brut mensual","nom.deducciones":"Deduccions del treballador","nom.ss":"Cotització a la Seguretat Social ({p})","nom.irpf":"Retenció d'IRPF ({p})","nom.liquido":"Líquid a percebre (el que cobra)","nom.empresa":"El que paga l'empresa","nom.ssEmpresa":"Seguretat Social a càrrec de l'empresa ({p} del brut)","nom.coste":"Cost total per a l'empresa","nom.nota":"Càlcul simplificat: pagues extres prorratejades i una retenció d'IRPF orientativa segons el sou brut anual.","col.incidencias":"Incidències","inc.vacaciones":"Vacances","inc.baja":"Baixa per malaltia","inc.accidente":"Accident","inc.formacion":"Formació","rec.prl":"{n} no té la formació en prevenció de riscos laborals, que és obligatòria. Si té un accident sense, hi haurà multa.","rec.vacaciones":"{n} té {d} dies de vacances sense fer i s'està cansant.","rec.temporal":"El contracte temporal de {n} s'acaba aquest mes. Decidiu si el feu indefinit.","aviso.accidente":"Accident laboral lleu: {nombre} ha estat de baixa mig mes.","aviso.accidenteSinPrl":"Accident laboral: {nombre} no tenia la formació en PRL. Inspecció de Treball ha posat una multa de {multa}.","aviso.bajaMedica":"Baixa per malaltia: {nombres} ha faltat mig mes.","aviso.finContrato":"Fi de contracte temporal: {nombres} ha deixat l'empresa.","cie.convertir":"Passen a indefinits","cie.vacaciones":"Vacances","man.version":"Versió {v}"}};"undefined"!=typeof module&&module.exports&&(module.exports=e),"undefined"!=typeof window&&(window.TextosSimula=e)}(),function(){var e={version:"0.7",es:{titulo:"Manual de Simula Pime",secciones:[{titulo:"¿Qué es Simula Pime?",bloques:["Simula Pime es un simulador de empresa. Vuestro equipo dirige una empresa recién creada del sector profesional que escojáis y compite con otras cinco empresas por los mismos clientes durante {rondas} rondas. Cada ronda equivale a un mes.","La empresa empieza con {capital} de capital social (la cifra cambia según el sector), sin personal, sin puestos de trabajo, sin proveedores y sin clientes. Todo lo demás depende de vuestras decisiones."]},{titulo:"Sectores profesionales",bloques:["Al empezar una partida se escoge el sector. Hay once, uno por cada familia de ciclos formativos del INS Miquel Biada de Mataró:","- Taller de reparación de automóviles (CFGM Electromecánica de vehículos automóviles, CFGS Automoción).","- Taller de chapa y pintura (CFGM Carrocería).","- Taller de motos (CFGM Electromecánica de vehículos, motocicletas).","- Mantenimiento de embarcaciones en el puerto de Mataró (CFGM Mantenimiento de embarcaciones de recreo).","- Mantenimiento industrial (CFGM Mantenimiento electromecánico, CFGS Mecatrónica industrial).","- Instalaciones eléctricas y automatización (CFGM Instalaciones eléctricas y automáticas, CFGS Automatización y robótica industrial).","- Taller de mecanizado CNC (CFGM Mecanizado, CFGS Programación de la producción en fabricación mecánica).","- Reformas y rehabilitación de viviendas (CFGB Reforma y mantenimiento de edificios, CFGM Obras de interior, decoración y rehabilitación, CFGS Proyectos de edificación).","- Laboratorio de análisis y control de calidad (CFGM Operaciones de laboratorio, CFGS Laboratorio de análisis y de control de calidad).","- Obrador de cosmética y productos de higiene (CFGS Fabricación de productos farmacéuticos, biotecnológicos y afines).","- Gestoría y asesoría de empresas (CFGM Gestión administrativa, CFGS Administración y finanzas).","Cada sector tiene sus precios, sueldos, materiales, temporada alta y baja, puestos de trabajo, candidatos con los estudios del sector, encargos, ideas de proyectos, empresas rivales y proveedores. Todos los sectores son igual de difíciles: lo que cambia es la realidad del oficio. Las cifras de este manual son las del sector de vuestra partida.","El profesorado puede fijar el sector de un grupo desde el panel de administración: el enlace del juego de ese grupo ya abre la partida en el sector escogido."]},{titulo:"Objetivo y nota",bloques:["Gana el equipo con la mejor nota media al final de la partida. Cada ronda recibís una nota de 0 a 100 que combina cinco áreas:","- **Finanzas (35 %):** margen de beneficio, caja positiva y deuda razonable.","- **Clientes (25 %):** parte del mercado que captáis, clientes que podéis atender y reputación.","- **Equipo (20 %):** motivación de la plantilla y que esté ocupada.","- **Marketing (10 %):** cuántos clientes os conocen.","- **Sostenibilidad (10 %):** inversión en medidas sostenibles.","Si la caja termina en negativo, la nota de la ronda se rebaja entre un 15 % y un 50 %, según lo grande que sea el descubierto. Una empresa sin dinero no puede ir bien aunque venda mucho."]},{titulo:"Cómo se juega una ronda",bloques:["- Revisad el **Panel**: resultados de la ronda anterior, avisos y consejo de mejora.","- Recorred los departamentos del menú de la izquierda y tomad sus decisiones. Cada pantalla tiene un botón «Siguiente» que os lleva a la próxima.","- Mirad el resumen de la derecha: os dice cuánto dinero gastaréis y si falta algo.","- Con el botón **Cerrar la ronda** (abajo del todo del menú) revisad todas las decisiones juntas, pulsad «Cerrar la ronda» y confirmad. Ya no se pueden cambiar.","- Se calcula qué ha pasado en el mercado y volvéis al Panel con los resultados.","El precio, los sueldos, la publicidad, la calidad, la sostenibilidad y las horas de los proyectos abiertos se mantienen de una ronda a otra hasta que los cambiéis. Contratar, despedir, dar formación, comprar puestos, presentar presupuestos, empezar o vender proyectos propios y pedir o devolver préstamos se hacen solo una vez."]},{titulo:"El menú y los departamentos",bloques:["El menú de la izquierda está organizado como los departamentos de una empresa:","- **Dirección.** Panel con los resultados de la última ronda y Clasificación de las seis empresas. El botón «Cerrar la ronda» está siempre abajo del menú.","- **Comercial y marketing.** Precio, publicidad y presupuestos para encargos de clientes.","- **Recursos humanos.** Selección de personal, Plantilla (sueldos, formación y despidos) y Análisis del rendimiento.","- **Producción.** Proveedores, puestos de trabajo, calidad y horas de trabajo.","- **Innovación (I+D).** Proyectos propios.","- **Finanzas.** Contabilidad (cuenta de resultados, balance y flujos de caja) y banco.","- **Sostenibilidad.** Medidas sostenibles.","- **Ayuda.** Este manual.","En el móvil, el menú se abre con el botón «Menú». La herramienta se abre en catalán; los botones ES y CA cambian el idioma. La partida se guarda en el navegador: si cerráis la página y volvéis desde el mismo dispositivo, continúa donde la dejasteis."]},{titulo:"Las decisiones de cada departamento",bloques:["**Comercial y marketing › Precio.** Lo que cobráis de media a cada cliente. El precio medio del sector es {precio} y atender a un cliente cuesta unos {coste} en materiales. Un precio bajo atrae más clientes pero deja menos margen; uno alto atrae menos, sobre todo si la reputación es baja.","**Comercial y marketing › Publicidad.** Cinco canales con cuatro niveles cada uno. La publicidad no funciona al instante: lo que se conoce de vuestra empresa es una mezcla de lo invertido esta ronda y en las anteriores. Usar varios canales a la vez da un extra de alcance, y cada nivel más alto de un mismo canal rinde menos que el anterior.","**Comercial y marketing › Presupuestos.** Precio que pedís por los encargos de clientes. Se explica más abajo, en «Encargos de clientes».","**Recursos humanos.** Aquí se contrata, se ajustan los sueldos, se da formación y se despide. Una persona a jornada completa con puesto de trabajo aporta {horasPersona} horas por ronda; si las dedica a los clientes del día a día, con habilidad normal y bien motivada, atiende unos {clientesEmpleado} clientes. A la empresa cada sueldo le cuesta un 53 % más por las cotizaciones a la Seguridad Social. Más abajo hay una sección entera dedicada a este departamento.","**Producción › Proveedores.** Materiales (imprescindibles), un servicio que os hace trabajar más rápido (opcional) y la gestión de residuos (obligatoria por ley). Se explica más abajo.","**Producción › Puestos de trabajo.** Cada puesto equipado cuesta {puesto} y da para una jornada completa: dos medias jornadas pueden compartirlo. Si faltan puestos, la plantilla cobra pero solo puede trabajar la parte que le permiten los puestos. Los puestos son inmovilizado: aparecen en el balance y pierden valor cada ronda (amortización).","**Producción › Calidad.** La inversión en calidad y atención al cliente mejora la reputación: los clientes satisfechos vuelven y os recomiendan. A partir de 1.500 € por ronda ya no aporta más.","**Producción › Horas de trabajo.** Reparto de las horas de la plantilla entre encargos, proyectos propios y clientes del día a día. Se explica más abajo.","**Innovación (I+D) › Proyectos propios.** Ideas que podéis desarrollar y después vender o mantener. Se explica más abajo.","**Finanzas › Banco.** Podéis pedir un préstamo al 7 % de interés anual. El banco presta como máximo el 80 % del patrimonio de la empresa menos lo que ya debéis. Si la caja queda en negativo, el descubierto se paga al 28 % anual.","**Sostenibilidad › Medidas sostenibles.** Reciclaje, energía renovable, productos y procesos menos contaminantes… Sube la nota de sostenibilidad y atrae a algunos clientes. A partir de 1.000 € por ronda ya no aporta más."]},{titulo:"Recursos humanos",bloques:["El departamento de **Recursos humanos** tiene tres pantallas. Arriba siempre veis cuántas personas tenéis, cuántas jornadas completas suman y si os faltan puestos de trabajo.","**Selección de personal.** Cada mes llegan seis currículums nuevos, más dos del mes anterior que todavía buscan trabajo. Cada candidatura indica edad, estudios, experiencia, jornada que pide (completa, 30 h o media jornada), sueldo que pide, puntos fuertes, puntos a tener en cuenta y la nota de la entrevista. La entrevista da una idea de lo bien que trabajará la persona, pero no es exacta. Podéis ofrecer un sueldo algo más bajo del que pide, pero no aceptará menos de un 92 %. Contratar cuesta 300 € de alta, y el primer mes cada persona rinde un 15 % menos mientras aprende cómo funciona la tienda.","**Plantilla.** Para cada persona podéis cambiar el sueldo, elegir un curso para este mes o despedirla. Despedir cuesta una indemnización de mes y medio de sueldo y baja la motivación del resto. Hay dos cursos:","- **Formación técnica (200 €):** sube el rendimiento de la persona un 4 % para siempre (hasta un 20 %), pero ocupa una cuarta parte de su tiempo ese mes.","- **Atención al cliente (150 €):** mejora la reputación de la empresa, y ocupa un 15 % de su tiempo ese mes. Algunas personas ya llegan con buena atención al cliente.","**Motivación.** Cada persona compara lo que cobra con lo que esperaba cobrar. Si cobra menos, se desmotiva y rinde menos; si cobra más, se motiva. Dar formación motiva un poco; despedir a alguien y no dar abasto con los clientes desmotiva. Si la motivación de alguien baja de 40, se va de la empresa a final de mes (baja voluntaria).","**Contratos.** Al contratar elegís el tipo de contrato. El **indefinido** da más seguridad y motivación; despedir cuesta mes y medio de sueldo. El **temporal** dura 3 meses y motiva algo menos: si al llegar al último mes no lo hacéis indefinido, la persona se va al acabar la ronda y se le pagan 12 días de sueldo por año trabajado. Despedir a un temporal antes de tiempo cuesta medio mes de sueldo. Pasar un temporal a indefinido le sube la motivación.","**Prevención de riesgos laborales (PRL).** La formación en PRL es obligatoria por ley. Cuesta 60 € y ocupa un 5 % del tiempo de un mes. Cada mes hay riesgo de accidente laboral: sin PRL es de un 7 % por persona y con PRL baja a un 1,5 %. Quien se accidenta trabaja medio mes y pierde motivación, y si no tenía la formación, Inspección de Trabajo pone una multa de 1.500 €.","**Vacaciones.** Cada persona genera 2,5 días de vacaciones al mes. Con 10 días acumulados puede hacer dos semanas de vacaciones: ese mes trabaja la mitad, pero vuelve más motivada. Si acumula 20 días o más sin hacerlas, se cansa y se desmotiva.","**Bajas por enfermedad.** Cada mes, cada persona tiene un 4 % de probabilidad de ponerse enferma y faltar medio mes. La empresa sigue pagando el sueldo. No se puede evitar, pero conviene tener algo de margen en la plantilla.","**Nómina.** En la Plantilla, el botón «Ver la nómina» muestra la nómina orientativa de cada persona: salario bruto, cotización a la Seguridad Social (6,5 %) y retención de IRPF del trabajador, líquido a percibir, Seguridad Social a cargo de la empresa y coste total. El coste total es el mismo que se apunta en la contabilidad como gasto de personal.","**Análisis del rendimiento.** Después de cada ronda veréis los indicadores del equipo (personas, gasto de personal, clientes por persona, motivación media y rotación), una tabla con el rendimiento, los clientes, las ventas, el coste, la aportación y las incidencias (vacaciones, bajas, accidentes, formación) de cada persona, un gráfico de aportaciones, recomendaciones y la evolución del equipo. La aportación es lo que ha vendido esa persona menos los materiales y lo que cuesta a la empresa."]},{titulo:"Encargos de clientes",bloques:["Cada ronda llegan solicitudes de presupuesto de clientes como clubes ciclistas, escuelas, hoteles o empresas de reparto. Llegan más en temporada alta y cuando las empresas del mercado son más conocidas. Cada solicitud indica las horas de trabajo estimadas, los materiales, el coste estimado y el plazo de entrega.","Las seis empresas pueden presentar presupuesto. El cliente elige la mejor oferta combinando el precio, la reputación y lo conocida que es cada empresa. Si todos los precios son demasiado altos comparados con el coste, no se lo da a nadie.","- Al ganar un encargo se factura entero y se cobra el 30 %. Los materiales se pagan en ese momento.","- El 70 % restante queda pendiente de cobro hasta la entrega. En el balance aparece como «Clientes».","- El encargo se entrega en cuanto se terminan sus horas de trabajo. Entregar a tiempo mejora la reputación.","- Si se entrega tarde, el cliente descuenta un 10 % de lo que falta por cobrar por cada ronda de retraso, y la reputación baja."]},{titulo:"Proyectos propios",bloques:["Cada ronda aparece una idea nueva de proyecto propio, hasta tener tres. Una idea que no se empieza desaparece al cabo de {vidaIdea} rondas.","Para empezarla, pulsad «Empezar esta ronda» en Innovación › Proyectos propios y asignadle horas en Producción › Horas de trabajo. Mientras se desarrolla no da ingresos, pero ocupa horas de la plantilla.","Cuando está terminado, podéis elegir:","- **Mantenerlo:** da ingresos cada ronda, que bajan poco a poco con el tiempo.","- **Venderlo:** cobráis su valor de venta de golpe. Ese valor baja un 5 % cada ronda desde que apareció la idea."]},{titulo:"Horas de trabajo",bloques:["Cada jornada completa con puesto de trabajo aporta {horasPersona} horas por ronda; una media jornada, la mitad. Los cursos de formación restan horas el mes en que se hacen. En Producción › Horas de trabajo repartís esas horas entre los encargos y los proyectos propios.","Las horas que no asignáis se dedican a los clientes del día a día: cuantas menos quedan, menos clientes podéis atender.","Las horas estimadas de cada proyecto suponen un rendimiento del 100 %. El rendimiento de vuestro equipo es la media del de cada persona (habilidad, motivación y formación): si es bajo, cada hora avanza menos trabajo y hacen falta más. Si asignáis a un proyecto más horas de las que necesita, las que sobran vuelven al día a día.","Las horas se asignan a mano, persona por persona: en la tabla de reparto cada fila es una persona con las horas que tiene disponibles y cada columna, un proyecto. La última columna indica las horas que le quedan para el día a día; si se pasa, sale en rojo."]},{titulo:"Proveedores",bloques:["En Producción › Proveedores escogéis un proveedor de cada categoría. La elección se mantiene de una ronda a otra hasta que la cambiéis. Cada sector tiene sus proveedores, pero siempre hay tres categorías y tres niveles:","- **Materiales (imprescindible).** Sin proveedor de materiales no podéis atender a ningún cliente. El económico es un 15 % más barato, empeora un poco la reputación y alguna vez falla (ese mes atendéis menos clientes); el estándar casi nunca falla; el prémium es un 12 % más caro, mejora la reputación y nunca falla.","- **Servicio (opcional).** Una cuota mensual que os hace trabajar más rápido: un 3 %, un 6 % o un 10 % más de clientes atendidos con las mismas horas. Los niveles más altos también mejoran la calidad.","- **Gestión de residuos (obligatoria por ley).** Una cuota mensual. Si no la tenéis, cada mes hay una posibilidad entre cuatro de inspección, con una multa de 1.200 € y menos nota de sostenibilidad. Los niveles estándar y prémium suman a la nota de sostenibilidad como si invirtierais 250 € o 500 € más en medidas sostenibles.","Las cuotas se cuentan como otros gastos de explotación. Las empresas rivales trabajan con proveedores estándar."]},{titulo:"Los clientes del día a día",bloques:["Cada ronda hay un número de clientes en el mercado que depende de la época del año (cada sector tiene su temporada alta y baja) y de cuánta publicidad hacen todas las empresas juntas. Cada cliente elige empresa según:","- Cuánto os conoce (publicidad acumulada).","- Vuestro precio comparado con el del sector.","- Vuestra reputación.","- Vuestro compromiso sostenible.","Solo podéis atender a los clientes a los que lleguen las horas que dejáis para el día a día. Los que se quedan sin atender se pierden y bajan vuestra reputación."]},{titulo:"Gastos fijos e impuestos",bloques:["Cada ronda pagáis {fijos} de alquiler, suministros y gestoría, aunque no vendáis nada. Los precios suben un 0,3 % por ronda por la inflación. Si hay beneficio, se paga un 25 % de impuesto sobre beneficios; si hay pérdidas, no se paga."]},{titulo:"La contabilidad",bloques:["En **Finanzas › Contabilidad** tenéis los tres documentos de cada ronda cerrada. Podéis consultar cualquier ronda anterior.","- **Cuenta de resultados.** Ingresos y gastos de la ronda. El resultado del ejercicio es el beneficio o la pérdida.","- **Balance de situación.** Lo que tiene la empresa (activo) y de dónde ha salido el dinero (patrimonio neto y pasivo). El total del activo siempre es igual al total del patrimonio neto y el pasivo.","- **Flujos de caja.** Entradas y salidas de dinero, separadas en explotación, inversión y financiación. Explican por qué ha cambiado la caja.","Las ventas del día a día y los gastos se cobran y se pagan en la misma ronda, pero los encargos no: se facturan enteros al ganarlos y el 70 % se cobra al entregarlos. Por eso las ventas de la cuenta de resultados y los cobros de los flujos de caja no coinciden, y lo pendiente aparece en el balance como «Clientes». Es un buen ejercicio seguir un encargo desde que se gana hasta que se cobra."]},{titulo:"Consejos para la primera ronda",bloques:["- Contratad al menos una o dos personas en Recursos humanos y comprad puestos suficientes para sus jornadas.","- Escoged un proveedor de materiales y uno de gestión de residuos.","- Invertid en dos o tres canales de publicidad en lugar de en uno solo.","- No bajéis mucho el precio: con poco margen es difícil cubrir sueldos y gastos fijos.","- Mirad la «Caja antes de vender» y las «Ventas necesarias para no perder» antes de cerrar.","- Presentad presupuestos con un margen moderado: si pedís demasiado, se lo quedará otra empresa.","- No ganéis más encargos de los que vuestra plantilla puede terminar a tiempo."]},{titulo:"Historial de cambios",bloques:["- **Versión 0.7.** Once sectores profesionales, uno por cada familia de ciclos del INS Miquel Biada; proveedores de materiales, servicio y residuos; reparto de horas a mano persona por persona; aviso verde «Guardado» cada vez que se guarda, y un único botón para cerrar la ronda.","- **Versión 0.6.1.** La herramienta se abre en catalán.","- **Versión 0.6.** Contratos indefinidos y temporales, formación obligatoria en prevención de riesgos laborales con accidentes y multas, vacaciones, bajas por enfermedad y nómina de cada persona.","- **Versión 0.5.** Encargos de clientes con presupuestos que compiten con los de las otras empresas, proyectos propios, reparto de las horas de cada persona de la plantilla y cobro del 70 % de los encargos al entregarlos.","- **Versión 0.4.** Recursos humanos completo: candidaturas con ficha y foto, cada persona con su sueldo, jornada, habilidad, motivación y formación, bajas voluntarias y análisis del rendimiento.","- **Versión 0.3.** Menú lateral organizado por departamentos de la empresa, cada uno con sus decisiones, y pantalla para revisar todas las decisiones antes de cerrar la ronda.","- **Versión 0.2.** Documentos contables (balance, cuenta de resultados y flujos de caja), herramienta en castellano y catalán, y este manual.","- **Versión 0.1.** Primera versión jugable: una empresa contra cinco rivales durante 8 rondas."]}]},ca:{titulo:"Manual de Simula Pime",secciones:[{titulo:"Què és Simula Pime?",bloques:["Simula Pime és un simulador d'empresa. El vostre equip dirigeix una empresa acabada de crear del sector professional que trieu i competeix amb altres cinc empreses pels mateixos clients durant {rondas} rondes. Cada ronda equival a un mes.","L'empresa comença amb {capital} de capital social (la xifra canvia segons el sector), sense personal, sense llocs de treball, sense proveïdors i sense clients. Tota la resta depèn de les vostres decisions."]},{titulo:"Sectors professionals",bloques:["En començar una partida es tria el sector. N'hi ha onze, un per cada família de cicles formatius de l'INS Miquel Biada de Mataró:","- Taller de reparació d'automòbils (CFGM Electromecànica de vehicles automòbils, CFGS Automoció).","- Taller de planxa i pintura (CFGM Carrosseria).","- Taller de motos (CFGM Electromecànica de vehicles, motocicletes).","- Manteniment d'embarcacions al port de Mataró (CFGM Manteniment d'embarcacions d'esbarjo).","- Manteniment industrial (CFGM Manteniment electromecànic, CFGS Mecatrònica industrial).","- Instal·lacions elèctriques i automatització (CFGM Instal·lacions elèctriques i automàtiques, CFGS Automatització i robòtica industrial).","- Taller de mecanitzat CNC (CFGM Mecanització, CFGS Programació de la producció en fabricació mecànica).","- Reformes i rehabilitació d'habitatges (CFGB Reforma i manteniment d'edificis, CFGM Obres d'interior, decoració i rehabilitació, CFGS Projectes d'edificació).","- Laboratori d'anàlisis i control de qualitat (CFGM Operacions de laboratori, CFGS Laboratori d'anàlisi i de control de qualitat).","- Obrador de cosmètica i productes d'higiene (CFGS Fabricació de productes farmacèutics, biotecnològics i afins).","- Gestoria i assessoria d'empreses (CFGM Gestió administrativa, CFGS Administració i finances).","Cada sector té els seus preus, sous, materials, temporada alta i baixa, llocs de feina, candidats amb els estudis del sector, encàrrecs, idees de projectes, empreses rivals i proveïdors. Tots els sectors són igual de difícils: el que canvia és la realitat de l'ofici. Les xifres d'aquest manual són les del sector de la vostra partida.","El professorat pot fixar el sector d'un grup des del panell d'administració: l'enllaç del joc d'aquell grup ja obre la partida en el sector triat."]},{titulo:"Objectiu i nota",bloques:["Guanya l'equip amb la millor nota mitjana al final de la partida. Cada ronda rebeu una nota de 0 a 100 que combina cinc àrees:","- **Finances (35 %):** marge de benefici, caixa positiva i deute raonable.","- **Clients (25 %):** part del mercat que capteu, clients que podeu atendre i reputació.","- **Equip (20 %):** motivació de la plantilla i que estigui ocupada.","- **Màrqueting (10 %):** quants clients us coneixen.","- **Sostenibilitat (10 %):** inversió en mesures sostenibles.","Si la caixa acaba en negatiu, la nota de la ronda es rebaixa entre un 15 % i un 50 %, segons com de gran sigui el descobert. Una empresa sense diners no pot anar bé encara que vengui molt."]},{titulo:"Com es juga una ronda",bloques:["- Reviseu el **Tauler**: resultats de la ronda anterior, avisos i consell de millora.","- Recorreu els departaments del menú de l'esquerra i preneu-ne les decisions. Cada pantalla té un botó «Següent» que us porta a la propera.","- Mireu el resum de la dreta: us diu quants diners gastareu i si falta alguna cosa.","- Amb el botó **Tancar la ronda** (a baix de tot del menú) reviseu totes les decisions juntes, premeu «Tancar la ronda» i confirmeu-ho. Ja no es poden canviar.","- Es calcula què ha passat al mercat i torneu al Tauler amb els resultats.","El preu, els sous, la publicitat, la qualitat, la sostenibilitat i les hores dels projectes oberts es mantenen d'una ronda a l'altra fins que els canvieu. Contractar, acomiadar, fer formació, comprar llocs de treball, presentar pressupostos, començar o vendre projectes propis i demanar o retornar préstecs es fan només una vegada."]},{titulo:"El menú i els departaments",bloques:["El menú de l'esquerra està organitzat com els departaments d'una empresa:","- **Direcció.** Tauler amb els resultats de la darrera ronda i Classificació de les sis empreses. El botó «Tancar la ronda» és sempre a baix del menú.","- **Comercial i màrqueting.** Preu, publicitat i pressupostos per a encàrrecs de clients.","- **Recursos humans.** Selecció de personal, Plantilla (sous, formació i acomiadaments) i Anàlisi del rendiment.","- **Producció.** Proveïdors, llocs de treball, qualitat i hores de treball.","- **Innovació (R+D).** Projectes propis.","- **Finances.** Comptabilitat (compte de resultats, balanç i fluxos de caixa) i banc.","- **Sostenibilitat.** Mesures sostenibles.","- **Ajuda.** Aquest manual.","Al mòbil, el menú s'obre amb el botó «Menú». L'eina s'obre en català; els botons ES i CA canvien l'idioma. La partida es desa al navegador: si tanqueu la pàgina i hi torneu des del mateix dispositiu, continua on la vau deixar."]},{titulo:"Les decisions de cada departament",bloques:["**Comercial i màrqueting › Preu.** El que cobreu de mitjana a cada client. El preu mitjà del sector és {precio} i atendre un client costa uns {coste} en materials. Un preu baix atrau més clients però deixa menys marge; un d'alt n'atrau menys, sobretot si la reputació és baixa.","**Comercial i màrqueting › Publicitat.** Cinc canals amb quatre nivells cadascun. La publicitat no funciona a l'instant: el que es coneix de la vostra empresa és una barreja del que heu invertit aquesta ronda i en les anteriors. Fer servir diversos canals alhora dona un extra d'abast, i cada nivell més alt d'un mateix canal rendeix menys que l'anterior.","**Comercial i màrqueting › Pressupostos.** Preu que demaneu pels encàrrecs de clients. S'explica més avall, a «Encàrrecs de clients».","**Recursos humans.** Aquí es contracta, s'ajusten els sous, es fa formació i s'acomiada. Una persona a jornada completa amb lloc de treball aporta {horasPersona} hores per ronda; si les dedica als clients del dia a dia, amb habilitat normal i ben motivada, atén uns {clientesEmpleado} clients. A l'empresa cada sou li costa un 53 % més per les cotitzacions a la Seguretat Social. Més avall hi ha una secció sencera dedicada a aquest departament.","**Producció › Proveïdors.** Materials (imprescindibles), un servei que us fa treballar més ràpid (opcional) i la gestió de residus (obligatòria per llei). S'explica més avall.","**Producció › Llocs de treball.** Cada lloc equipat costa {puesto} i dona per a una jornada completa: dues mitges jornades el poden compartir. Si falten llocs, la plantilla cobra però només pot treballar la part que li permeten els llocs. Els llocs de treball són immobilitzat: apareixen al balanç i perden valor cada ronda (amortització).","**Producció › Qualitat.** La inversió en qualitat i atenció al client millora la reputació: els clients satisfets tornen i us recomanen. A partir de 1.500 € per ronda ja no aporta més.","**Producció › Hores de treball.** Repartiment de les hores de la plantilla entre encàrrecs, projectes propis i clients del dia a dia. S'explica més avall.","**Innovació (R+D) › Projectes propis.** Idees que podeu desenvolupar i després vendre o mantenir. S'explica més avall.","**Finances › Banc.** Podeu demanar un préstec al 7 % d'interès anual. El banc deixa com a màxim el 80 % del patrimoni de l'empresa menys el que ja deveu. Si la caixa queda en negatiu, el descobert es paga al 28 % anual.","**Sostenibilitat › Mesures sostenibles.** Reciclatge, energia renovable, productes i processos menys contaminants… Apuja la nota de sostenibilitat i atrau alguns clients. A partir de 1.000 € per ronda ja no aporta més."]},{titulo:"Recursos humans",bloques:["El departament de **Recursos humans** té tres pantalles. A dalt sempre veieu quantes persones teniu, quantes jornades completes sumen i si us falten llocs de treball.","**Selecció de personal.** Cada mes arriben sis currículums nous, més dos del mes anterior que encara busquen feina. Cada candidatura indica edat, estudis, experiència, jornada que demana (completa, 30 h o mitja jornada), sou que demana, punts forts, punts a tenir en compte i la nota de l'entrevista. L'entrevista dona una idea de com de bé treballarà la persona, però no és exacta. Podeu oferir un sou una mica més baix del que demana, però no n'acceptarà menys d'un 92 %. Contractar costa 300 € d'alta, i el primer mes cada persona rendeix un 15 % menys mentre aprèn com funciona la botiga.","**Plantilla.** Per a cada persona podeu canviar el sou, triar un curs per a aquest mes o acomiadar-la. Acomiadar costa una indemnització d'un mes i mig de sou i fa baixar la motivació de la resta. Hi ha dos cursos:","- **Formació tècnica (200 €):** augmenta el rendiment de la persona un 4 % per sempre (fins a un 20 %), però ocupa una quarta part del seu temps aquell mes.","- **Atenció al client (150 €):** millora la reputació de l'empresa, i ocupa un 15 % del seu temps aquell mes. Algunes persones ja arriben amb bona atenció al client.","**Motivació.** Cada persona compara el que cobra amb el que esperava cobrar. Si cobra menys, es desmotiva i rendeix menys; si cobra més, es motiva. Fer formació motiva una mica; acomiadar algú i no donar l'abast amb els clients desmotiva. Si la motivació d'algú baixa de 40, marxa de l'empresa a final de mes (baixa voluntària).","**Contractes.** En contractar trieu el tipus de contracte. L'**indefinit** dona més seguretat i motivació; acomiadar costa un mes i mig de sou. El **temporal** dura 3 mesos i motiva una mica menys: si en arribar a l'últim mes no el feu indefinit, la persona marxa en acabar la ronda i se li paguen 12 dies de sou per any treballat. Acomiadar un temporal abans d'hora costa mig mes de sou. Passar un temporal a indefinit li apuja la motivació.","**Prevenció de riscos laborals (PRL).** La formació en PRL és obligatòria per llei. Costa 60 € i ocupa un 5 % del temps d'un mes. Cada mes hi ha risc d'accident laboral: sense PRL és d'un 7 % per persona i amb PRL baixa a un 1,5 %. Qui s'accidenta treballa mig mes i perd motivació, i si no tenia la formació, Inspecció de Treball posa una multa de 1.500 €.","**Vacances.** Cada persona genera 2,5 dies de vacances al mes. Amb 10 dies acumulats pot fer dues setmanes de vacances: aquell mes treballa la meitat, però torna més motivada. Si n'acumula 20 o més sense fer-les, es cansa i es desmotiva.","**Baixes per malaltia.** Cada mes, cada persona té un 4 % de probabilitat de posar-se malalta i faltar mig mes. L'empresa continua pagant el sou. No es pot evitar, però convé tenir una mica de marge a la plantilla.","**Nòmina.** A la Plantilla, el botó «Veure la nòmina» mostra la nòmina orientativa de cada persona: salari brut, cotització a la Seguretat Social (6,5 %) i retenció d'IRPF del treballador, líquid a percebre, Seguretat Social a càrrec de l'empresa i cost total. El cost total és el mateix que s'apunta a la comptabilitat com a despesa de personal.","**Anàlisi del rendiment.** Després de cada ronda veureu els indicadors de l'equip (persones, despesa de personal, clients per persona, motivació mitjana i rotació), una taula amb el rendiment, els clients, les vendes, el cost, l'aportació i les incidències (vacances, baixes, accidents, formació) de cada persona, un gràfic d'aportacions, recomanacions i l'evolució de l'equip. L'aportació és el que ha venut aquella persona menys els materials i el que costa a l'empresa."]},{titulo:"Encàrrecs de clients",bloques:["Cada ronda arriben sol·licituds de pressupost de clients com clubs ciclistes, escoles, hotels o empreses de repartiment. N'arriben més en temporada alta i quan les empreses del mercat són més conegudes. Cada sol·licitud indica les hores de feina estimades, els materials, el cost estimat i el termini de lliurament.","Les sis empreses poden presentar pressupost. El client tria la millor oferta combinant el preu, la reputació i com de coneguda és cada empresa. Si tots els preus són massa alts comparats amb el cost, no el dona a ningú.","- En guanyar un encàrrec es factura sencer i se'n cobra el 30 %. Els materials es paguen en aquell moment.","- El 70 % restant queda pendent de cobrament fins al lliurament. Al balanç apareix com a «Clients».","- L'encàrrec es lliura tan bon punt se n'acaben les hores de feina. Lliurar a temps millora la reputació.","- Si es lliura tard, el client descompta un 10 % del que queda per cobrar per cada ronda de retard, i la reputació baixa."]},{titulo:"Projectes propis",bloques:["Cada ronda apareix una idea nova de projecte propi, fins a tenir-ne tres. Una idea que no es comença desapareix al cap de {vidaIdea} rondes.","Per començar-la, premeu «Començar aquesta ronda» a Innovació › Projectes propis i assigneu-li hores a Producció › Hores de treball. Mentre es desenvolupa no dona ingressos, però ocupa hores de la plantilla.","Quan està acabat, podeu triar:","- **Mantenir-lo:** dona ingressos cada ronda, que baixen a poc a poc amb el temps.","- **Vendre'l:** en cobreu el valor de venda de cop. Aquest valor baixa un 5 % cada ronda des que va aparèixer la idea."]},{titulo:"Hores de treball",bloques:["Cada jornada completa amb lloc de treball aporta {horasPersona} hores per ronda; una mitja jornada, la meitat. Els cursos de formació resten hores el mes que es fan. A Producció › Hores de treball repartiu aquestes hores entre els encàrrecs i els projectes propis.","Les hores que no assigneu es dediquen als clients del dia a dia: com menys en queden, menys clients podeu atendre.","Les hores estimades de cada projecte suposen un rendiment del 100 %. El rendiment del vostre equip és la mitjana del de cada persona (habilitat, motivació i formació): si és baix, cada hora avança menys feina i en calen més. Si assigneu a un projecte més hores de les que necessita, les que sobren tornen al dia a dia.","Les hores s'assignen a mà, persona per persona: a la taula de repartiment cada fila és una persona amb les hores que té disponibles i cada columna, un projecte. La darrera columna indica les hores que li queden per al dia a dia; si es passa, surt en vermell."]},{titulo:"Proveïdors",bloques:["A Producció › Proveïdors trieu un proveïdor de cada categoria. L'elecció es manté d'una ronda a l'altra fins que la canvieu. Cada sector té els seus proveïdors, però sempre hi ha tres categories i tres nivells:","- **Materials (imprescindible).** Sense proveïdor de materials no podeu atendre cap client. L'econòmic és un 15 % més barat, empitjora una mica la reputació i alguna vegada falla (aquell mes ateneu menys clients); l'estàndard gairebé mai falla; el prèmium és un 12 % més car, millora la reputació i mai falla.","- **Servei (opcional).** Una quota mensual que us fa treballar més ràpid: un 3 %, un 6 % o un 10 % més de clients atesos amb les mateixes hores. Els nivells més alts també milloren la qualitat.","- **Gestió de residus (obligatòria per llei).** Una quota mensual. Si no la teniu, cada mes hi ha una possibilitat entre quatre d'inspecció, amb una multa de 1.200 € i menys nota de sostenibilitat. Els nivells estàndard i prèmium sumen a la nota de sostenibilitat com si invertíssiu 250 € o 500 € més en mesures sostenibles.","Les quotes es compten com a altres despeses d'explotació. Les empreses rivals treballen amb proveïdors estàndard."]},{titulo:"Els clients del dia a dia",bloques:["Cada ronda hi ha un nombre de clients al mercat que depèn de l'època de l'any (cada sector té la seva temporada alta i baixa) i de quanta publicitat fan totes les empreses juntes. Cada client tria empresa segons:","- Quant us coneix (publicitat acumulada).","- El vostre preu comparat amb el del sector.","- La vostra reputació.","- El vostre compromís sostenible.","Només podeu atendre els clients als quals arribin les hores que deixeu per al dia a dia. Els que es queden sense atendre es perden i fan baixar la vostra reputació."]},{titulo:"Despeses fixes i impostos",bloques:["Cada ronda pagueu {fijos} de lloguer, subministraments i gestoria, encara que no vengueu res. Els preus pugen un 0,3 % per ronda per la inflació. Si hi ha benefici, es paga un 25 % d'impost sobre beneficis; si hi ha pèrdues, no se'n paga."]},{titulo:"La comptabilitat",bloques:["A **Finances › Comptabilitat** teniu els tres documents de cada ronda tancada. Podeu consultar qualsevol ronda anterior.","- **Compte de resultats.** Ingressos i despeses de la ronda. El resultat de l'exercici és el benefici o la pèrdua.","- **Balanç de situació.** El que té l'empresa (actiu) i d'on han sortit els diners (patrimoni net i passiu). El total de l'actiu sempre és igual al total del patrimoni net i el passiu.","- **Fluxos de caixa.** Entrades i sortides de diners, separades en explotació, inversió i finançament. Expliquen per què ha canviat la caixa.","Les vendes del dia a dia i les despeses es cobren i es paguen en la mateixa ronda, però els encàrrecs no: es facturen sencers en guanyar-los i el 70 % es cobra en lliurar-los. Per això les vendes del compte de resultats i els cobraments dels fluxos de caixa no coincideixen, i el que queda pendent apareix al balanç com a «Clients». És un bon exercici seguir un encàrrec des que es guanya fins que es cobra."]},{titulo:"Consells per a la primera ronda",bloques:["- Contracteu com a mínim una o dues persones a Recursos humans i compreu prou llocs de treball per a les seves jornades.","- Trieu un proveïdor de materials i un de gestió de residus.","- Invertiu en dos o tres canals de publicitat en lloc d'un de sol.","- No abaixeu gaire el preu: amb poc marge és difícil cobrir sous i despeses fixes.","- Mireu la «Caixa abans de vendre» i les «Vendes necessàries per no perdre» abans de tancar.","- Presenteu pressupostos amb un marge moderat: si demaneu massa, se'l quedarà una altra empresa.","- No guanyeu més encàrrecs dels que la vostra plantilla pot acabar a temps."]},{titulo:"Historial de canvis",bloques:["- **Versió 0.7.** Onze sectors professionals, un per cada família de cicles de l'INS Miquel Biada; proveïdors de materials, servei i residus; repartiment d'hores a mà persona per persona; avís verd «Desat» cada vegada que es desa, i un sol botó per tancar la ronda.","- **Versió 0.6.1.** L'eina s'obre en català.","- **Versió 0.6.** Contractes indefinits i temporals, formació obligatòria en prevenció de riscos laborals amb accidents i multes, vacances, baixes per malaltia i nòmina de cada persona.","- **Versió 0.5.** Encàrrecs de clients amb pressupostos que competeixen amb els de les altres empreses, projectes propis, repartiment de les hores de cada persona de la plantilla i cobrament del 70 % dels encàrrecs en lliurar-los.","- **Versió 0.4.** Recursos humans complet: candidatures amb fitxa i foto, cada persona amb el seu sou, jornada, habilitat, motivació i formació, baixes voluntàries i anàlisi del rendiment.","- **Versió 0.3.** Menú lateral organitzat per departaments de l'empresa, cadascun amb les seves decisions, i pantalla per revisar totes les decisions abans de tancar la ronda.","- **Versió 0.2.** Documents comptables (balanç, compte de resultats i fluxos de caixa), eina en castellà i català, i aquest manual.","- **Versió 0.1.** Primera versió jugable: una empresa contra cinc rivals durant 8 rondes."]}]},variables:function(e,a,s){var i=function(e){return String(Math.round(e)).replace(/\B(?=(\d{3})+(?!\d))/g,".")+" €"};return{capital:i(e.capitalInicial),rondas:String(a),precio:i(e.precioReferencia),coste:i(e.costeVariable),salario:i(e.salarioMercado),clientesEmpleado:String(e.clientesPorEmpleado),puesto:i(e.costePuesto),fijos:i(e.gastosFijos),horasPersona:String(s.HORES_PERSONA),vidaIdea:String(s.VIDA_IDEA)}}};"undefined"!=typeof module&&module.exports&&(module.exports=e),"undefined"!=typeof window&&(window.ManualSimula=e)}()</script><script>!function(){var a=window.MotorSimula,t=window.crearPartida(a),i=window.TextosSimula,e=window.ManualSimula,n="simula-pime-partida-v4",r="simula-pime-idioma",s={panel:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x
