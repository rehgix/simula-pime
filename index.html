<style>
/* Disposición: cabecera con navegación e idioma, una columna de contenido; en Decisiones, formulario a la izquierda y resumen fijo a la derecha. */
:root {
  --fondo: #FFF1DC; --superficie: #FFFFFF; --suave: #FBF5EA; --tinta: #14171F; --gris: #5B6472; --linea: #F0E0C4;

  --alerta: #B23A12; --alerta-suave: #FDECE7; --alerta-linea: #F1B8A8; --bien: #0F7B4F;
  --titulos: 'Space Grotesk', 'Inter', system-ui, sans-serif; --texto: 'Inter', system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { background: var(--fondo); color: var(--tinta); font-family: var(--texto); font-size: 15px; line-height: 1.45; }
h1, h2, h3 { font-family: var(--titulos); font-weight: 600; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h1 { font-size: 28px; } h2 { font-size: 19px; } h3 { font-size: 17px; }
p { margin: 0; }
a { color: var(--principal-texto); }
.marca { font-family: var(--titulos); font-weight: 600; font-size: 22px; }
.marca span { color: var(--principal-texto); }
/* Menú lateral fijo en ordenador; en el móvil se pliega bajo el botón «Menú». */
.app { display: flex; min-height: 100vh; }
.lateral { flex: 0 0 250px; align-self: flex-start; position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--superficie); border-right: 1px solid var(--linea); padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; display: flex; flex-direction: column; gap: 20px; }
.lateral-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-left: 12px; }
.menu-boton { display: none; min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--principal-fuerte); background: var(--superficie); color: var(--tinta); font: inherit; font-weight: 600; cursor: pointer; }
#menu { display: flex; flex-direction: column; gap: 18px; }
.grupo { display: flex; flex-direction: column; gap: 2px; }
.grupo .dep { padding: 0 12px 4px; font-size: 12px; font-weight: 600; color: var(--gris); text-transform: uppercase; letter-spacing: 0.06em; }
.grupo button { min-height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--tinta); font: inherit; text-align: left; cursor: pointer; }
.grupo button:hover { background: var(--suave); }
.grupo button[aria-current="page"] { background: var(--principal-suave); color: var(--principal-texto); font-weight: 600; }
.grupo button.cierre { margin-top: 4px; border-color: var(--principal-fuerte); font-weight: 600; }
.principal { flex: 1 1 auto; min-width: 0; padding-block: 16px 48px; padding-left: 32px; padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }
.barra-sup { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: flex-end; }

.contenido h1:focus { outline: none; }
.repaso td.valor { white-space: normal; min-width: 160px; }
.enlace { min-height: 40px; padding: 0 8px; border: 0; background: transparent; color: var(--principal-texto); font: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; }
.chip { padding: 8px 12px; border-radius: 8px; background: var(--superficie); border: 1px solid var(--linea); font-weight: 600; }
.idioma { display: flex; border: 1px solid var(--principal-fuerte); border-radius: 8px; overflow: hidden; }
.idioma button { min-width: 44px; min-height: 40px; border: 0; background: var(--superficie); color: var(--tinta); font: inherit; font-weight: 600; cursor: pointer; }
.idioma button[aria-pressed="true"] { background: var(--principal); }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--principal-fuerte); outline-offset: 2px; }
.tarjeta { background: var(--superficie); border: 1px solid var(--linea); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.fila { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }

.kpi .eti, .gris { color: var(--gris); font-size: 13px; }

.area { display: flex; align-items: center; gap: 12px; }
.area .nom { flex: 0 0 116px; } .area .num { flex: 0 0 28px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.barra { flex: 1 1 auto; height: 8px; border-radius: 4px; background: var(--linea); }

.niveles button { min-width: 78px; min-height: 48px; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--linea); background: var(--superficie); color: var(--tinta); font: inherit; font-size: 13px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; }

.par { display: flex; justify-content: space-between; gap: 12px; }

.par > :last-child { white-space: nowrap; }
.grande { font-family: var(--titulos); font-size: 24px; font-weight: 600; }
hr { border: 0; border-top: 1px solid var(--linea); margin: 0; width: 100%; }
.pastillas { display: flex; flex-wrap: wrap; gap: 6px; }
.pastillas button { min-width: 48px; min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--linea); background: var(--superficie); color: var(--tinta); font: inherit; cursor: pointer; }
.pastillas button[aria-pressed="true"] { background: var(--principal); border-color: var(--principal-fuerte); font-weight: 600; }
.doc td { white-space: normal; }
.doc td:last-child { white-space: nowrap; width: 1%; padding-left: 20px; }
.doc tr.l td:first-child { padding-left: 24px; }
.doc tr.h td, .doc tr.s td { font-weight: 600; }

#hores-resum { display: flex; flex-direction: column; gap: 10px; }

.dades { margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px 16px; }

.conmutador { min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--principal-fuerte); background: var(--superficie); color: var(--tinta); font: inherit; font-weight: 600; cursor: pointer; }

.doc tr.p td:first-child { padding-left: 12px; }
.manual { max-width: 72ch; display: flex; flex-direction: column; gap: 12px; }
.manual h2 { margin-top: 12px; }

/* Recursos humanos */
.subnav { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--linea); padding-bottom: 10px; }
.subnav button { min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--linea); background: var(--superficie); color: var(--tinta); font: inherit; cursor: pointer; }
.subnav button[aria-pressed="true"] { background: var(--principal); border-color: var(--principal-fuerte); font-weight: 600; }
.rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 16px; }
.cand { background: var(--superficie); border: 1px solid var(--linea); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.cand.previsto { border: 2px solid var(--principal-fuerte); background: var(--principal-suave); }
.cand.fuera { border: 2px solid var(--alerta-linea); background: var(--alerta-suave); }
.cand-cab { display: flex; gap: 14px; align-items: center; }
.cara { flex: 0 0 auto; width: 72px; height: 72px; border-radius: 50%; overflow: hidden; }
.cara.peq { width: 36px; height: 36px; }
.cara svg { display: block; width: 100%; height: 100%; }
.cand-cab h3 { font-size: 18px; }
.datos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
.datos div { display: flex; flex-direction: column; min-width: 0; }
.datos b { font-variant-numeric: tabular-nums; }
.estrellas { color: var(--principal-fuerte); letter-spacing: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: #E3F4EA; color: var(--bien); }
.chips.ojo span { background: var(--alerta-suave); color: var(--alerta); }
.cand .campo { flex: 0 0 auto; }
.insignias { display: flex; flex-wrap: wrap; gap: 6px; }
.insignia { font-size: 13px; padding: 3px 9px; border-radius: 6px; background: var(--suave); border: 1px solid var(--linea); }
.insignia.mal { background: var(--alerta-suave); border-color: var(--alerta-linea); color: var(--alerta); }
.insignia.ok { background: #E3F4EA; border-color: #BFE3CD; color: var(--bien); }
.nomina { width: 100%; border-collapse: collapse; font-size: 14px; }
.nomina td { padding: 6px 4px; border-bottom: 1px solid var(--linea); white-space: normal; }
.nomina td:last-child { text-align: right; white-space: nowrap; }
.nomina tr.g td { font-weight: 600; color: var(--gris); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; padding-top: 12px; }

.oferta { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.oferta .campo { flex: 1 1 150px; }
.mini { font-size: 13px; }
.persona-fila { display: flex; gap: 10px; align-items: center; }
.barra-h { display: flex; align-items: center; gap: 10px; }
.barra-h .nom { flex: 0 0 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.barra-h .pista { flex: 1 1 auto; position: relative; height: 18px; background: var(--suave); border-radius: 4px; }
.barra-h .pista span { position: absolute; top: 0; height: 18px; border-radius: 4px; background: var(--principal); }
.barra-h .pista span.neg { background: var(--alerta); }
.barra-h .pista i { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--gris); }
.barra-h .num { flex: 0 0 84px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.etiqueta { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 13px; font-weight: 600; }
.etiqueta.excelente { background: #E3F4EA; color: var(--bien); } .etiqueta.bien { background: var(--principal-suave); color: var(--principal-texto); }
.etiqueta.mejorable { background: var(--suave); color: var(--gris); } .etiqueta.bajo { background: var(--alerta-suave); color: var(--alerta); }
.boton.peligro { background: var(--superficie); border: 1px solid var(--alerta-linea); color: var(--alerta); }
.boton[disabled] { opacity: 0.5; cursor: not-allowed; }
@media (max-width: 860px) {
  .app { flex-direction: column; }
  .lateral { position: static; height: auto; flex: none; align-self: stretch; border-right: 0; border-bottom: 1px solid var(--linea); padding-block: 12px; padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 12px; }
  .lateral-top { padding-left: 0; }
  .menu-boton { display: inline-flex; align-items: center; }
  #menu { display: none; padding-bottom: 8px; }
  #menu.abierto { display: flex; }

}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<div class="app">
  <aside class="lateral">
    <div class="lateral-top">
      <div class="marca">Simula <span>Pime</span></div>
      <button type="button" class="menu-boton" id="menu-boton" data-accion="menu" aria-controls="menu" aria-expanded="false">Menú</button>
    </div>
    <nav id="menu"></nav>
  </aside>
  <div class="principal">
    <div class="barra-sup">
      <div class="chip" id="chip-ronda"></div>
      <div class="idioma" role="group" id="idioma">
        <button type="button" data-idioma="es" lang="es">ES</button>
        <button type="button" data-idioma="ca" lang="ca">CA</button>
      </div>
    </div>
    <main id="vista" class="contenido"></main>
  </div>

<script>(function () {
// Simula Pime — projectes: encàrrecs de clients (amb pressupostos que competeixen) i projectes propis (idees de l'empresa).
// Només dades i càlculs; els noms dels projectes es tradueixen a la pantalla amb les claus enc.* i idea.*.

const HORES_PERSONA = 160; // hores de feina d'una persona a jornada completa en una ronda (un mes)
const COST_HORA = 18; // cost estimat d'una hora de feina, per calcular el cost orientatiu dels encàrrecs (€)
const PREU_MAXIM = 1.9; // un client no accepta pressupostos de més de 1,9 vegades el cost estimat
const COBRAMENT_INICIAL = 0.3; // part de l'encàrrec que es cobra en adjudicar-lo; la resta, en lliurar-lo
const DESCOMPTE_RETARD = 0.1; // el client descompta un 10 % del que queda per cobrar per cada ronda de retard
const PERDUA_VALOR_IDEA = 0.95; // una idea perd un 5 % de valor de venda cada ronda (deixa de ser una novetat)
const PERDUA_INGRES = 0.97; // els ingressos mensuals d'un projecte propi baixen un 3 % cada ronda
const VIDA_IDEA = 4; // rondes que una idea continua disponible si no es comença

// Encàrrecs que poden demanar els clients: hores de feina i materials (valors de referència).
const ENCARRECS = [
  { tipus: 'policia', hores: 120, materials: 900 },
  { tipus: 'reparto', hores: 200, materials: 1500 },
  { tipus: 'escuela', hores: 160, materials: 4000 },
  { tipus: 'club', hores: 90, materials: 600 },
  { tipus: 'adaptadas', hores: 240, materials: 2500 },
  { tipus: 'mensajeria', hores: 260, materials: 5500 },
  { tipus: 'hotel', hores: 180, materials: 3000 },
  { tipus: 'feria', hores: 80, materials: 300 },
];

// Idees de projectes propis: hores de feina, valor de venda un cop acabat i ingrés mensual si es manté.
const IDEES = [
  { tipus: 'botigaOnline', hores: 300, valor: 9000, mensual: 1300 },
  { tipus: 'lloguer', hores: 450, valor: 14000, mensual: 2000 },
  { tipus: 'kitElectric', hores: 500, valor: 16000, mensual: 2200 },
  { tipus: 'curs', hores: 160, valor: 4000, mensual: 600 },
  { tipus: 'app', hores: 260, valor: 7500, mensual: 1050 },
  { tipus: 'marcaPropia', hores: 700, valor: 24000, mensual: 3300 },
  { tipus: 'ruta', hores: 200, valor: 5000, mensual: 700 },
  { tipus: 'domicili', hores: 240, valor: 6000, mensual: 850 },
];

// Generador de nombres a l'atzar repetible: la mateixa llavor dona sempre la mateixa partida.
function atzar(llavor) {
  let a = llavor >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function termini(hores) { return Math.ceil(hores / 140) + 1; }

// Sol·licituds de pressupost que arriben al mercat en una ronda.
function generarSollicituds(llavor, ronda, quantes) {
  const rnd = atzar(llavor * 31 + ronda * 7919);
  const disponibles = ENCARRECS.slice();
  const llista = [];
  for (let i = 0; i < quantes && disponibles.length; i++) {
    const base = disponibles.splice(Math.floor(rnd() * disponibles.length), 1)[0];
    const factor = 0.8 + 0.4 * rnd();
    const hores = Math.round((base.hores * factor) / 10) * 10;
    const materials = Math.round((base.materials * factor) / 50) * 50;
    llista.push({ id: 'S' + ronda + '-' + (i + 1), tipus: base.tipus, hores, materials, cost: hores * COST_HORA + materials, termini: termini(hores) });
  }
  return llista;
}

// Una idea nova per a un equip, diferent de les que ja té.
function novaIdea(llavor, ronda, salt, jaTe) {
  const rnd = atzar(llavor * 17 + ronda * 104729 + salt * 613);
  const lliures = IDEES.filter((i) => jaTe.indexOf(i.tipus) < 0);
  if (!lliures.length) return null;
  const base = lliures[Math.floor(rnd() * lliures.length)];
  const factor = 0.9 + 0.2 * rnd();
  return {
    id: 'I' + ronda + '-' + salt + '-' + base.tipus, tipus: base.tipus, ronda,
    hores: Math.round((base.hores * factor) / 10) * 10, valor: Math.round((base.valor * factor) / 100) * 100, mensual: Math.round((base.mensual * factor) / 10) * 10,
  };
}

function valorVenda(projecte, ronda) { return Math.round(projecte.valor * Math.pow(PERDUA_VALOR_IDEA, ronda - projecte.ronda)); }
function ingresMensual(projecte, ronda) { return Math.round(projecte.mensual * Math.pow(PERDUA_INGRES, Math.max(0, ronda - projecte.rondaFi - 1))); }

// Cada sol·licitud s'adjudica a l'oferta amb millor puntuació: preu baix respecte al cost, bona reputació i empresa coneguda.
// ofertes: [{ id: equip, ofertes: { idSollicitud: preu }, reputacio, notorietat }]
function resoldreLicitacions(sollicituds, ofertes) {
  return sollicituds.map((s) => {
    const presentades = {};
    let guanyador = null;
    let millor = -1;
    for (const o of ofertes) {
      const preu = Math.round((o.ofertes || {})[s.id] || 0);
      if (preu <= 0) continue;
      presentades[o.id] = preu;
      if (preu > s.cost * PREU_MAXIM) continue;
      const punts = Math.pow(s.cost / preu, 2.5) * (0.6 + 0.8 * o.reputacio) * (0.4 + o.notorietat);
      if (punts > millor) { millor = punts; guanyador = o.id; }
    }
    return { id: s.id, tipus: s.tipus, guanyador, preu: guanyador ? presentades[guanyador] : 0, ofertes: presentades };
  });
}

const PR = {
  HORES_PERSONA, COST_HORA, PREU_MAXIM, COBRAMENT_INICIAL, DESCOMPTE_RETARD, VIDA_IDEA, ENCARRECS, IDEES,
  atzar, generarSollicituds, novaIdea, valorVenda, ingresMensual, resoldreLicitacions,
};
if (typeof module !== 'undefined' && module.exports) module.exports = PR;
if (typeof window !== 'undefined') window.ProjectesSimula = PR;

})();
(function () {
// Simula Pime — motor de cálculo de una ronda.
// Módulo puro: recibe la configuración, el estado de los equipos y sus decisiones,
// y devuelve el nuevo estado con resultados y nota. No depende de pantallas ni de base de datos.

// Els projectes (encàrrecs i projectes propis) viuen en un mòdul a part.
const PR = typeof window !== 'undefined' && window.ProjectesSimula ? window.ProjectesSimula : require('./projectes.js');

const CANALES = {
  web: [0, 450, 800, 1250],
  ferias: [0, 500, 900, 1400],
  visitas: [0, 600, 1100, 1700],
  prensa: [0, 400, 800, 1200],
  agentes: [0, 700, 1200, 1800],
};

const SECTOR_BICIS = {
  id: 'bicis',
  nombre: 'Comercio y reparación de bicicletas',
  clientesPorEquipo: 400, // clientes potenciales por ronda y por equipo participante
  crecimiento: 0.03, // el mercado crece un 3 % por ronda
  estacionalidad: [0.85, 0.9, 1.0, 1.15, 1.25, 1.2, 1.0, 0.9],
  precioReferencia: 60, // ticket medio de referencia (€)
  costeVariable: 20, // coste de materiales por cliente atendido (€)
  salarioMercado: 1500, // salario neto mensual que espera un empleado (€)
  costeSalarialFactor: 1.53, // seguros sociales: lo que paga la empresa sobre el neto
  clientesPorEmpleado: 110, // clientes que atiende un empleado al 100 % de rendimiento
  costePuesto: 2400, // equipar un puesto de trabajo (€)
  gastosFijos: 2000, // alquiler, suministros, gestoría (€/ronda)
  capitalInicial: 20000,
};

const ECONOMIA = {
  impuestoBeneficios: 0.25,
  interesPrestamo: 0.07, // anual
  interesDescubierto: 0.28, // anual: tipo vigente + 24 puntos
  amortizacionRondas: 96, // 8 años
  ipcPorRonda: 0.003,
};

// Cursos que se pueden dar a cada persona de la plantilla (modo plantilla individual).
const CURSOS = {
  tecnica: { coste: 200, tiempo: 0.75 }, // mecánica avanzada: +4 % de rendimiento por curso (máx. +20 %)
  atencion: { coste: 150, tiempo: 0.85 }, // atención al cliente: mejora la reputación de la tienda
  prl: { coste: 60, tiempo: 0.95 }, // prevención de riesgos laborales: obligatoria por ley, reduce los accidentes
};

// Reglas laborales del modo plantilla individual.
const LABORAL = {
  mesesTemporal: 3, // duración del contrato temporal
  indemnizacionIndefinido: 1.5, // despido de un indefinido: mes y medio de sueldo
  indemnizacionTemporal: 0.5, // despido antes de acabar un temporal
  finContratoPorMes: 12 / 365, // al acabar un temporal: 12 días de sueldo por año trabajado
  vacacionesPorMes: 2.5, // días de vacaciones que se generan cada mes
  diasVacaciones: 10, // un turno de vacaciones: dos semanas laborables
  probBaja: 0.04, // probabilidad de baja por enfermedad cada mes
  probAccidente: 0.07, probAccidentePrl: 0.015,
  sancionSinPrl: 1500, // multa de Inspección de Trabajo si hay un accidente sin formación en PRL
};

// Azar repetible: el mismo texto da siempre el mismo número entre 0 y 1.
function azarFijo(texto) {
  let h = 2166136261;
  for (let i = 0; i < texto.length; i++) { h ^= texto.charCodeAt(i); h = Math.imul(h, 16777619); }
  h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995); h ^= h >>> 15;
  return (h >>> 0) / 4294967296;
}

const limitar = (x, min, max) => Math.max(min, Math.min(max, x));
const redondear = (x) => Math.round(x);

// Todos los importes se calculan en euros enteros, para que los documentos contables cuadren al céntimo.
function estadoInicial(sector) {
  return {
    capital: sector.capitalInicial,
    caja: sector.capitalInicial,
    deuda: 0,
    puestos: 0,
    valorPuestos: 0, // valor neto contable de los puestos de trabajo
    inmovilizadoBruto: 0, // lo que costaron los puestos, sin restar amortización
    empleados: 0,
    notoriedad: 0.12, // 0..1: parte del mercado que conoce la empresa
    reputacion: 0.5, // 0..1: calidad percibida
    motivacion: 0.7, // 0..1
    formacion: 0, // rondas de formación acumuladas
    beneficioAcumulado: 0,
    deutors: 0, // lo que los clientes deben por encargos aún no entregados
    projectes: [], // encargos de clientes en curso
    propis: [], // proyectos propios en curso o terminados
    idees: [], // ideas de proyectos propios que se pueden empezar
    notas: [],
  };
}

// Plantilla individual: cada persona tiene su sueldo, jornada, habilidad, motivación y formación.
// Se usa cuando el estado tiene la lista «plantilla» (el equipo del jugador). Las decisiones de personal
// llegan en d.rrhh = { contratar: [candidatos con salario y jornada], despedir: [ids], salarios: {id: €}, cursos: {id: 'tecnica'|'atencion'} }.
// ronda: si se indica, se sortean las bajas por enfermedad y los accidentes; sin ronda (previsión) no hay imprevistos.
function plantillaRonda(sector, e, d, ipc, ronda) {
  const r = d.rrhh || {};
  const fuera = new Set(r.despedir || []);
  const convertir = new Set(r.convertir || []);
  const vacaciones = new Set(r.vacaciones || []);
  const salarios = r.salarios || {};
  const cursos = r.cursos || {};
  const despedidos = e.plantilla.filter((p) => fuera.has(p.id));
  const siguen = e.plantilla.filter((p) => !fuera.has(p.id)).map((p) => Object.assign({}, p, {
    salario: salarios[p.id] > 0 ? Math.round(salarios[p.id]) : p.salario, nuevo: false,
    contrato: p.contrato === 'temporal' && convertir.has(p.id) ? 'indefinido' : (p.contrato || 'indefinido'),
    convertido: p.contrato === 'temporal' && convertir.has(p.id),
  }));
  const nuevos = (r.contratar || []).map((c) => Object.assign({}, c, {
    salario: Math.round(c.salario), contrato: c.contrato === 'temporal' ? 'temporal' : 'indefinido',
    motivacion: 0.7, formacionTec: 0, cursos: [], antiguedad: 0, diasVacaciones: 0, prl: false, nuevo: true, convertido: false, historial: [],
  }));
  let sancion = 0;
  const personas = siguen.concat(nuevos).map((p) => {
    const curso = CURSOS[cursos[p.id]] ? cursos[p.id] : null;
    const dias = p.diasVacaciones || 0;
    const deVacaciones = vacaciones.has(p.id) && dias >= LABORAL.diasVacaciones;
    const temporal = p.contrato === 'temporal';
    const ratio = p.salario / (p.deseado * ipc);
    const objetivo = limitar(0.7 + (ratio - 1) * 1.2 + (curso ? 0.05 : 0) - (despedidos.length ? 0.1 : 0)
      + (deVacaciones ? 0.08 : 0) - (!deVacaciones && dias >= 20 ? 0.05 : 0) // las vacaciones descansan; acumular muchas cansa
      - (temporal ? 0.05 : 0) + (p.convertido ? 0.1 : 0), 0.1, 1); // un contrato estable da seguridad
    // Imprevistos del mes: baja por enfermedad y accidente laboral (menos probable con formación en PRL).
    const semilla = p.id + '|' + p.apellidos + '|' + p.habilidad + '|' + ronda;
    const baja = ronda ? azarFijo(semilla + '|baja') < LABORAL.probBaja : false;
    const prl = p.prl || curso === 'prl';
    const accidente = ronda ? azarFijo(semilla + '|accidente') < (prl ? LABORAL.probAccidentePrl : LABORAL.probAccidente) : false;
    if (accidente && !prl) sancion += LABORAL.sancionSinPrl;
    const motivacion = 0.5 * p.motivacion + 0.5 * objetivo - (accidente ? 0.05 : 0);
    const adaptacion = p.nuevo ? 0.85 : 1; // la primera ronda se aprende el oficio de la casa
    const rendimiento = (0.6 + 0.5 * motivacion) * (1 + Math.min(0.2, p.formacionTec * 0.04)) * p.habilidad * adaptacion;
    // Cada ausencia (vacaciones, baja, accidente) quita medio mes de trabajo.
    const tiempo = (curso ? CURSOS[curso].tiempo : 1) * (deVacaciones ? 0.5 : 1) * (baja ? 0.5 : 1) * (accidente ? 0.5 : 1);
    // Un temporal que llega a su último mes sin convertirse se va al acabar la ronda.
    const finContrato = temporal && p.antiguedad + 1 >= LABORAL.mesesTemporal;
    return Object.assign({}, p, {
      curso, motivacion, rendimiento, tiempo, deVacaciones, baja, accidente, prl, finContrato,
      capacidadBruta: sector.clientesPorEmpleado * p.jornada * rendimiento * tiempo,
    });
  });
  const jornadas = personas.reduce((s, p) => s + p.jornada, 0);
  const indemnizacion = (p) => p.salario * (p.contrato === 'temporal' ? LABORAL.indemnizacionTemporal : LABORAL.indemnizacionIndefinido);
  return {
    personas, despedidos, nuevos, jornadas, sancion,
    puestosNecesarios: Math.ceil(jornadas - 1e-9),
    motivacion: jornadas > 0 ? personas.reduce((s, p) => s + p.motivacion * p.jornada, 0) / jornadas : e.motivacion,
    atencion: jornadas > 0 ? personas.reduce((s, p) => s + (p.atencion || p.curso === 'atencion' ? p.jornada : 0), 0) / jornadas : 0,
    costePersonal: Math.round(personas.reduce((s, p) => s + p.salario, 0) * sector.costeSalarialFactor),
    costeContratacion: nuevos.length * 300,
    indemnizaciones: Math.round(despedidos.reduce((s, p) => s + indemnizacion(p), 0)
      + personas.filter((p) => p.finContrato).reduce((s, p) => s + p.salario * LABORAL.finContratoPorMes * (p.antiguedad + 1), 0)),
    costeFormacion: personas.reduce((s, p) => s + (p.curso ? CURSOS[p.curso].coste : 0), 0),
  };
}

// Alcance del marketing: cada canal rinde cada vez menos y combinar canales suma un extra.
function alcanceMarketing(marketing) {
  let puntos = 0;
  let usados = 0;
  let gasto = 0;
  for (const canal of Object.keys(CANALES)) {
    const nivel = limitar(marketing[canal] || 0, 0, 3);
    gasto += CANALES[canal][nivel];
    if (nivel > 0) usados += 1;
    puntos += [0, 0.09, 0.15, 0.19][nivel];
  }
  const diversidad = [0, 0, 0.03, 0.07, 0.11, 0.15][usados];
  return { alcance: limitar(puntos + diversidad, 0, 0.95), gasto };
}

function normalizar(d, sector) {
  return {
    precio: limitar(d.precio || sector.precioReferencia, sector.precioReferencia * 0.5, sector.precioReferencia * 2),
    marketing: d.marketing || {},
    contratar: Math.max(0, Math.floor(d.contratar || 0)),
    despedir: Math.max(0, Math.floor(d.despedir || 0)),
    salario: Math.max(0, d.salario || sector.salarioMercado),
    formacion: !!d.formacion,
    comprarPuestos: Math.max(0, Math.floor(d.comprarPuestos || 0)),
    calidad: Math.max(0, d.calidad || 0), // € invertidos en calidad y atención al cliente
    sostenibilidad: Math.max(0, d.sostenibilidad || 0), // € invertidos en medidas sostenibles
    pedirPrestamo: Math.max(0, d.pedirPrestamo || 0),
    devolverPrestamo: Math.max(0, d.devolverPrestamo || 0),
    ofertes: d.ofertes || {}, // presupuestos presentados: { idSolicitud: precio }
    hores: d.hores || {}, // horas asignadas: { idProyecto: horas }
    iniciar: d.iniciar || [], // ideas que se empiezan a desarrollar esta ronda
    vendre: d.vendre || [], // proyectos propios terminados que se venden esta ronda
  };
}

// Calcula una ronda completa para todos los equipos de un mismo mercado.
// equipos: [{ id, estado, decisiones }]  ·  ronda: 1, 2, 3...
// mercat: { sollicituds: [...] } con los encargos que piden presupuesto esta ronda.
function calcularRonda(sector, equipos, ronda, mercat) {
  const ipc = Math.pow(1 + ECONOMIA.ipcPorRonda, ronda - 1);
  const estacion = sector.estacionalidad[(ronda - 1) % sector.estacionalidad.length];
  const clientesMercado = sector.clientesPorEquipo * equipos.length * estacion * Math.pow(1 + sector.crecimiento, ronda - 1);

  // 1. Preparación: plantilla, puestos, notoriedad, motivación y capacidad de cada equipo.
  const prep = equipos.map((eq) => {
    const e = eq.estado;
    const d = normalizar(eq.decisiones || {}, sector);
    const mk = alcanceMarketing(d.marketing);

    const individual = Array.isArray(e.plantilla);
    const pl = individual ? plantillaRonda(sector, e, eq.decisiones || {}, ipc, ronda) : null;
    const despedidos = individual ? pl.despedidos.length : Math.min(d.despedir, e.empleados);
    const empleados = individual ? pl.personas.length : e.empleados - despedidos + d.contratar;
    const puestos = e.puestos + d.comprarPuestos;

    // La publicidad tarda en hacer efecto: pesa más lo acumulado que lo de esta ronda.
    const notoriedad = limitar(0.5 * e.notoriedad + 0.5 * mk.alcance, 0.03, 0.95);

    const ratioSalario = d.salario / (sector.salarioMercado * ipc);
    const motivacionObjetivo = limitar(0.7 + (ratioSalario - 1) * 1.2 + (d.formacion ? 0.05 : 0) - (despedidos > 0 ? 0.1 : 0), 0.1, 1);
    const motivacion = individual ? pl.motivacion : 0.5 * e.motivacion + 0.5 * motivacionObjetivo;

    const formacion = e.formacion + (d.formacion ? 1 : 0);
    // Horas de trabajo de la ronda y rendimiento medio de la plantilla.
    // capacidadPlena = clientes de tienda que se atenderían si todas las horas fueran a la tienda.
    let horesDisponibles, rendimiento, capacidadPlena;
    if (individual) {
      // Cada puesto da para una jornada completa: dos medias jornadas pueden compartir puesto.
      const factorPuestos = pl.jornadas > 0 ? Math.min(1, puestos / pl.jornadas) : 0;
      pl.personas.forEach((x) => { x.capacidad = x.capacidadBruta * factorPuestos; x.hores = PR.HORES_PERSONA * x.jornada * x.tiempo * factorPuestos; });
      horesDisponibles = pl.personas.reduce((s, x) => s + x.hores, 0);
      capacidadPlena = pl.personas.reduce((s, x) => s + x.capacidad, 0);
      rendimiento = horesDisponibles > 0 ? pl.personas.reduce((s, x) => s + x.rendimiento * x.hores, 0) / horesDisponibles : 0.6 + 0.5 * motivacion;
    } else {
      rendimiento = (0.6 + 0.5 * motivacion) * (1 + Math.min(0.2, formacion * 0.04));
      const horasFormacion = d.formacion ? 0.75 : 1; // la formación quita una cuarta parte del tiempo
      const empleadosConPuesto = Math.min(empleados, puestos);
      horesDisponibles = empleadosConPuesto * PR.HORES_PERSONA * horasFormacion;
      capacidadPlena = (horesDisponibles / PR.HORES_PERSONA) * sector.clientesPorEmpleado * rendimiento;
    }

    // Proyectos propios: las ideas que se empiezan esta ronda ya pueden recibir horas.
    const ideesEquip = e.idees || [];
    const iniciades = ideesEquip.filter((i) => d.iniciar.indexOf(i.id) >= 0).map((i) => Object.assign({}, i, { pendents: i.hores, estat: 'curs' }));
    const propis = (e.propis || []).map((x) => Object.assign({}, x)).concat(iniciades);
    const projectes = (e.projectes || []).map((x) => Object.assign({}, x));

    // Horas asignadas a proyectos: si se piden más de las disponibles, se reparten en proporción.
    // Cada hora avanza tanto trabajo como el rendimiento de la plantilla; las horas que sobran vuelven a la tienda.
    const treballables = projectes.concat(propis.filter((x) => x.estat === 'curs'));
    const demanades = treballables.reduce((s, x) => s + Math.max(0, Number(d.hores[x.id]) || 0), 0);
    const escala = demanades > horesDisponibles ? horesDisponibles / demanades : 1;
    let horesProjectes = 0;
    for (const x of treballables) {
      const h = Math.min(Math.max(0, Number(d.hores[x.id]) || 0) * escala, x.pendents / rendimiento);
      x.pendents = Math.max(0, x.pendents - h * rendimiento);
      if (x.pendents < 0.5) x.pendents = 0;
      x.horesRonda = Math.round(h);
      horesProjectes += h;
    }
    const horesBotiga = Math.max(0, horesDisponibles - horesProjectes);
    const fraccioBotiga = horesDisponibles > 0 ? horesBotiga / horesDisponibles : 0;
    const capacidad = capacidadPlena * fraccioBotiga;
    if (individual) pl.personas.forEach((x) => { x.capacidad *= fraccioBotiga; });

    const reputacionCalidad = limitar(d.calidad / 1500, 0, 1);
    const atractivo =
      Math.pow(notoriedad, 1.0) *
      Math.pow((sector.precioReferencia * ipc) / d.precio, 1.6) *
      (0.6 + 0.8 * e.reputacion) *
      (1 + 0.1 * limitar(d.sostenibilidad / 1000, 0, 1));

    return { eq, e, d, mk, pl, despedidos, empleados, puestos, notoriedad, motivacion, formacion, rendimiento, capacidad, reputacionCalidad, atractivo,
      horesDisponibles, horesProjectes, horesBotiga, projectes, propis, ideesEquip };
  });

  // Encargos: cada solicitud se adjudica a la mejor oferta entre todas las empresas.
  const sollicituds = (mercat && mercat.sollicituds) || [];
  const licitacions = PR.resoldreLicitacions(sollicituds, prep.map((p) => ({ id: p.eq.id, ofertes: p.d.ofertes, reputacio: p.e.reputacion, notorietat: p.notoriedad })));

  // 2. Reparto de clientes: cada equipo capta según su atractivo frente al de los demás.
  const atractivoTotal = prep.reduce((s, p) => s + p.atractivo, 0) || 1;
  const notoriedadMedia = prep.reduce((s, p) => s + p.notoriedad, 0) / prep.length;
  const clientesActivos = clientesMercado * limitar(0.35 + notoriedadMedia, 0, 1); // un mercado poco publicitado compra menos

  // 3. Resultados económicos de cada equipo.
  return prep.map((p) => {
    const { e, d, mk } = p;
    const cuota = p.atractivo / atractivoTotal;
    const demanda = clientesActivos * cuota;
    const atendidos = Math.min(demanda, p.capacidad);
    const servicio = demanda > 0 ? atendidos / demanda : 1; // parte de la demanda que se pudo atender
    const horesBotigaUsades = p.capacidad > 0 ? (atendidos / p.capacidad) * p.horesBotiga : 0;
    const ocupacion = p.horesDisponibles > 0 ? (p.horesProjectes + horesBotigaUsades) / p.horesDisponibles : 0;

    // Encargos terminados: se cobra lo que faltaba (el 70 %), con descuento si se entrega tarde.
    let cobramentsLliurament = 0, descomptes = 0, saldatDeutors = 0, aTemps = 0, tard = 0;
    const lliurats = [];
    const enCurs = [];
    for (const x of p.projectes) {
      if (x.pendents > 0) { enCurs.push(x); continue; }
      const pendent = x.preu - x.cobratInicial;
      const retard = Math.max(0, ronda - x.limit);
      const descompte = redondear(pendent * Math.min(0.5, PR.DESCOMPTE_RETARD * retard));
      saldatDeutors += pendent; descomptes += descompte; cobramentsLliurament += pendent - descompte;
      if (retard) tard += 1; else aTemps += 1;
      lliurats.push({ id: x.id, tipus: x.tipus, retard, cobrament: pendent - descompte, descompte });
    }
    const endarrerits = enCurs.filter((x) => ronda >= x.limit).map((x) => ({ id: x.id, tipus: x.tipus }));

    // Encargos ganados esta ronda: se factura el total, se cobra el 30 % y se compran los materiales.
    let vendaProjectes = 0, cobramentsInicials = 0, materialsProjectes = 0;
    const adjudicats = [];
    for (const l of licitacions) {
      if (l.guanyador !== p.eq.id) continue;
      const s = sollicituds.find((x) => x.id === l.id);
      const inicial = redondear(l.preu * PR.COBRAMENT_INICIAL);
      vendaProjectes += l.preu; cobramentsInicials += inicial; materialsProjectes += redondear(s.materials * ipc);
      adjudicats.push({ id: s.id, tipus: s.tipus, preu: l.preu, cobratInicial: inicial, hores: s.hores, pendents: s.hores, limit: ronda + s.termini, rondaAdj: ronda });
    }
    const deutors = (e.deutors || 0) + (vendaProjectes - cobramentsInicials) - saldatDeutors;

    // Proyectos propios: los terminados dan ingresos cada ronda o se venden.
    let monetitzacio = 0, vendaPropis = 0;
    const acabats = [], venuts = [], propisSeguents = [];
    for (const x of p.propis) {
      if (x.estat === 'curs') {
        if (x.pendents === 0) { x.estat = 'acabat'; x.rondaFi = ronda; acabats.push({ id: x.id, tipus: x.tipus }); }
        propisSeguents.push(x);
        continue;
      }
      if (d.vendre.indexOf(x.id) >= 0) {
        const v = PR.valorVenda(x, ronda);
        vendaPropis += v; venuts.push({ id: x.id, tipus: x.tipus, import: v });
        continue;
      }
      x.ingresRonda = PR.ingresMensual(x, ronda);
      monetitzacio += x.ingresRonda;
      propisSeguents.push(x);
    }
    const ideesSeguents = p.ideesEquip.filter((i) => d.iniciar.indexOf(i.id) < 0 && ronda + 1 - i.ronda < PR.VIDA_IDEA);

    const ventasTienda = redondear(atendidos * d.precio);
    const ventas = ventasTienda + vendaProjectes - descomptes + monetitzacio + vendaPropis;
    const cobros = ventasTienda + cobramentsInicials + cobramentsLliurament + monetitzacio + vendaPropis;
    const costeMateriales = redondear(atendidos * sector.costeVariable * ipc) + materialsProjectes;
    const pl = p.pl;
    const costePersonal = pl ? pl.costePersonal : redondear(p.empleados * d.salario * sector.costeSalarialFactor);
    const costeContratacion = pl ? pl.costeContratacion : d.contratar * 300;
    const indemnizaciones = pl ? pl.indemnizaciones : redondear(p.despedidos * d.salario * 1.5);
    const costeFormacion = pl ? pl.costeFormacion : (d.formacion ? p.empleados * 150 : 0);
    const gastosFijos = redondear(sector.gastosFijos * ipc);
    const calidad = redondear(d.calidad);
    const sostenibilidad = redondear(d.sostenibilidad);
    const compraPuestos = redondear(d.comprarPuestos * sector.costePuesto * ipc);
    const inmovilizadoBruto = (e.inmovilizadoBruto || 0) + compraPuestos;
    const amortizacion = redondear((e.valorPuestos + compraPuestos) / ECONOMIA.amortizacionRondas);
    const valorPuestos = e.valorPuestos + compraPuestos - amortizacion;

    const interesPrestamo = redondear((e.deuda * ECONOMIA.interesPrestamo) / 12);

    RIVALES.forEach((r, i) => equipos.push({ id: 'rival' + i, nombre: r.nombre, jugador: false, estado: M.estadoInicial(SECTOR), historial: [] }));
    equipos = afegirIdees(afegirIdees(equipos, semilla, 0), semilla, 1);
    return { ronda: 1, terminada: false, semilla, llavor: semilla, contratadosAntes: [], sollicituds: sollicitudsDeRonda(semilla, 1, 0), equipos };
  }

  function rrhhVacio() { return { contratar: [], despedir: [], salarios: {}, cursos: {}, convertir: [], vacaciones: [] }; }

  function decisionesIniciales() {
    return {
      precio: SECTOR.precioReferencia, marketing: { web: 0, ferias: 0, visitas: 0, prensa: 0, agentes: 0 },
      contratar: 0, despedir: 0, salario: SECTOR.salarioMercado, formacion: false, comprarPuestos: 0,
      calidad: 0, sostenibilidad: 0, pedirPrestamo: 0, devolverPrestamo: 0,
      rrhh: rrhhVacio(),
      ofertes: {}, hores: {}, iniciar: [], vendre: [],
    };
  }

  // Lo que se repite de una ronda a otra (precio, salario, publicidad, calidad, sostenibilidad) se conserva; lo puntual vuelve a cero.
  // Las horas de los proyectos que siguen abiertos también se conservan.
  function decisionesSiguientes(d, estado) {
    const hores = {};
    const oberts = estado ? estado.projectes.concat(estado.propis.filter((x) => x.estat === 'curs')) : [];
    oberts.forEach((x) => { if (d.hores && d.hores[x.id]) hores[x.id] = d.hores[x.id]; });
    return Object.assign({}, d, { marketing: Object.assign({}, d.marketing), contratar: 0, despedir: 0, formacion: false, comprarPuestos: 0, pedirPrestamo: 0, devolverPrestamo: 0,
      rrhh: rrhhVacio(), ofertes: {}, hores, iniciar: [], vendre: [] });
  }

  function cerrarRonda(p, decisionesJugador) {
    if (p.terminada) return p;
    const entrada = p.equipos.map((eq, i) => ({
      id: eq.id, estado: eq.estado,
      decisiones: eq.jugador ? decisionesJugador : decisionRival(RIVALES[i - 1], i - 1, p.ronda, eq.estado, p.sollicituds),
    }));
    const salida = M.calcularRonda(SECTOR, entrada, p.ronda, { sollicituds: p.sollicituds });
    let equipos = p.equipos.map((eq) => {
      const s = salida.find((x) => x.id === eq.id);
      return Object.assign({}, eq, { estado: s.estado, historial: eq.historial.concat([s.resultado]) });
    });
    const ronda = p.ronda + 1;
    // Quien ha estado contratado alguna vez ya no vuelve a aparecer como candidato.
    const contratadosAntes = (p.contratadosAntes || []).concat(((decisionesJugador.rrhh || {}).contratar || []).map((c) => c.id));
    const terminada = ronda > RONDAS;
    const notoriedadMedia = equipos.reduce((s, eq) => s + eq.estado.notoriedad, 0) / equipos.length;
    if (!terminada) equipos = afegirIdees(equipos, p.llavor, ronda);
    return { ronda, terminada, semilla: p.semilla, contratadosAntes, llavor: p.llavor, sollicituds: terminada ? [] : sollicitudsDeRonda(p.llavor, ronda, notoriedadMedia), equipos };
  }

  function clasificacion(p) {
    return p.equipos
      .map((eq) => {
        const u = eq.historial[eq.historial.length - 1];
        return { id: eq.id, nombre: eq.nombre, jugador: eq.jugador, notaMedia: u ? u.notaMedia : null, nota: u ? u.nota : null, caja: Math.round(eq.estado.caja), cuota: u ? u.cuota : null };
      })
      .sort((a, b) => (b.notaMedia || 0) - (a.notaMedia || 0) || b.caja - a.caja)
      .map((x, i) => Object.assign(x, { posicion: i + 1 }));
  }

  // Coste que la empresa ya tiene comprometido con las decisiones actuales, antes de vender nada.
  function prevision(estado, d) {
    const mk = M.alcanceMarketing(d.marketing || {});
    if (Array.isArray(estado.plantilla)) {
      const pl = M.plantillaRonda(SECTOR, estado, d, 1);
      const puestos = estado.puestos + (d.comprarPuestos || 0);
      const personal = pl.costePersonal + pl.costeContratacion + pl.indemnizaciones + pl.costeFormacion;
      const compra = (d.comprarPuestos || 0) * SECTOR.costePuesto;
      const gastos = personal + SECTOR.gastosFijos + mk.gasto + (d.calidad || 0) + (d.sostenibilidad || 0) + compra;
      const factor = pl.jornadas > 0 ? Math.min(1, puestos / pl.jornadas) : 0;
      const horesDisp = pl.personas.reduce((s, x) => s + PR.HORES_PERSONA * x.jornada * x.tiempo * factor, 0);
      const rendimentMitja = horesDisp > 0 ? pl.personas.reduce((s, x) => s + x.rendimiento * PR.HORES_PERSONA * x.jornada * x.tiempo * factor, 0) / horesDisp : 0.6 + 0.5 * pl.motivacion;
      const h = horesPrevistes(estado, d, horesDisp, rendimentMitja, pl.personas.reduce((s, x) => s + x.capacidadBruta, 0) * factor);
      const capacidad = h.capacidad;
      const patrimonio = estado.caja + estado.valorPuestos - estado.deuda;
      return {
        empleados: pl.personas.length, jornadas: pl.jornadas, puestos, puestosNecesarios: pl.puestosNecesarios,
        sinPuesto: Math.max(0, pl.puestosNecesarios - puestos), puestosLibres: Math.max(0, puestos - pl.puestosNecesarios),
        personal: Math.round(personal), contratar: pl.nuevos.length, despedir: pl.despedidos.length,
        formar: pl.personas.filter((x) => x.curso).length, finContratos: pl.personas.filter((x) => x.finContrato), motivacion: pl.motivacion, personas: pl.personas,
        gastoMarketing: mk.gasto, alcance: mk.alcance, gastos: Math.round(gastos),
        cajaAntesDeVentas: Math.round(estado.caja - gastos + (d.pedirPrestamo || 0) - (d.devolverPrestamo || 0)),
        capacidad: Math.round(capacidad), ventasParaCubrir: Math.round(gastos - compra),
        limitePrestamo: Math.max(0, Math.round(patrimonio * 0.8 - estado.deuda)),
        rendiment: rendimentMitja, horesDisponibles: h.horesDisponibles, horesProjectes: h.horesProjectes, horesBotiga: h.horesBotiga, horesDemanades: h.horesDemanades,
      };
    }
    const despedidos = Math.min(d.despedir || 0, estado.empleados);
    const empleados = estado.empleados - despedidos + (d.contratar || 0);
    const puestos = estado.puestos + (d.comprarPuestos || 0);
    const personal = empleados * (d.salario || 0) * SECTOR.costeSalarialFactor + (d.contratar || 0) * 300 + despedidos * (d.salario || 0) * 1.5 + (d.formacion ? empleados * 150 : 0);
    const compra = (d.comprarPuestos || 0) * SECTOR.costePuesto;
    const gastos = personal + SECTOR.gastosFijos + mk.gasto + (d.calidad || 0) + (d.sostenibilidad || 0) + compra;
    const conPuesto = Math.min(empleados, puestos);
    const rendiment = (0.6 + 0.5 * estado.motivacion) * (1 + Math.min(0.2, estado.formacion * 0.04));
    const horesDisp = conPuesto * PR.HORES_PERSONA * (d.formacion ? 0.75 : 1);
    const h = horesPrevistes(estado, d, horesDisp, rendiment, (horesDisp / PR.HORES_PERSONA) * SECTOR.clientesPorEmpleado * rendiment);
    const capacidad = h.capacidad;
    const patrimonio = estado.caja + estado.valorPuestos - estado.deuda;
    return {
      empleados, puestos, sinPuesto: Math.max(0, empleados - puestos), puestosLibres: Math.max(0, puestos - empleados),
      gastoMarketing: mk.gasto, alcance: mk.alcance, gastos: Math.round(gastos),
      cajaAntesDeVentas: Math.round(estado.caja - gastos + (d.pedirPrestamo || 0) - (d.devolverPrestamo || 0)),
      capacidad: Math.round(capacidad), rendiment,
      horesDisponibles: h.horesDisponibles, horesProjectes: h.horesProjectes, horesBotiga: h.horesBotiga, horesDemanades: h.horesDemanades,
      ventasParaCubrir: Math.round(gastos - compra),
      limitePrestamo: Math.max(0, Math.round(patrimonio * 0.8 - estado.deuda)),
    };
  }

  // Reparto previsto de las horas entre proyectos y tienda, igual que lo calculará el motor al cerrar la ronda.
  function horesPrevistes(estado, d, horesDisponibles, rendiment, capacidadPlena) {
    const oberts = projectesOberts(estado, d);
    const demanades = oberts.reduce((s, x) => s + Math.max(0, Number((d.hores || {})[x.id]) || 0), 0);
    const escala = demanades > horesDisponibles ? horesDisponibles / demanades : 1;
    let horesProjectes = 0;
    oberts.forEach((x) => { horesProjectes += Math.min(Math.max(0, Number((d.hores || {})[x.id]) || 0) * escala, x.pendents / rendiment); });
    const horesBotiga = Math.max(0, horesDisponibles - horesProjectes);
    return {
      horesDisponibles: Math.round(horesDisponibles), horesProjectes: Math.round(horesProjectes), horesBotiga: Math.round(horesBotiga), horesDemanades: Math.round(demanades),
      capacidad: horesDisponibles > 0 ? capacidadPlena * horesBotiga / horesDisponibles : 0,
    };
  }

  // Proyectos que pueden recibir horas esta ronda: encargos en curso, propios en curso y las ideas que se empiezan ahora.
  function projectesOberts(estado, d) {
    const iniciar = (d && d.iniciar) || [];
    return estado.projectes.map((x) => Object.assign({ classe: 'encarrec' }, x))
      .concat(estado.propis.filter((x) => x.estat === 'curs').map((x) => Object.assign({ classe: 'propi' }, x)))
      .concat(estado.idees.filter((x) => iniciar.indexOf(x.id) >= 0).map((x) => Object.assign({ classe: 'propi', pendents: x.hores, nou: true }, x)));
  }

  // Reparto automático: primero los encargos que vencen antes, luego los propios, sin pasar de las horas disponibles.
  function repartirHores(estado, d) {
    const v = prevision(estado, Object.assign({}, d, { hores: {} }));
    let lliures = v.horesDisponibles;
    const hores = {};
    projectesOberts(estado, d).sort((a, b) => (a.classe === b.classe ? (a.limit || 0) - (b.limit || 0) : a.classe === 'encarrec' ? -1 : 1)).forEach((x) => {
      const h = Math.min(lliures, Math.ceil(x.pendents / v.rendiment));
      if (h > 0) { hores[x.id] = h; lliures -= h; }
    });
    return hores;
  }

  // Los textos no viven aquí: se devuelven claves y la pantalla las traduce al idioma elegido.
  function consejo(resultado) {
    let peor = null;
    for (const k of Object.keys(resultado.areas)) if (peor === null || resultado.areas[k] < resultado.areas[peor]) peor = k;
    return peor;
  }

  function avisos(resultado, estado) {
    const a = [];
    const necesarios = Array.isArray(estado.plantilla) ? Math.ceil(estado.plantilla.reduce((s, x) => s + x.jornada, 0) - 1e-9) : estado.empleados;
    if (resultado.rrhh && resultado.rrhh.bajas.length) a.push({ tipo: 'alerta', clave: 'bajas', datos: { nombres: resultado.rrhh.bajas.map((x) => x.nombre).join(', ') } });
    const rh = resultado.rrhh;
    if (rh) {
      rh.accidentes.forEach((x) => a.push({ tipo: 'alerta', clave: x.sinPrl ? 'accidenteSinPrl' : 'accidente', datos: { nombre: x.nombre, multa: String(M.LABORAL.sancionSinPrl).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ' €' } }));
      if (rh.bajasMedicas.length) a.push({ tipo: 'info', clave: 'bajaMedica', datos: { nombres: rh.bajasMedicas.map((x) => x.nombre).join(', ') } });
      if (rh.finContratos.length) a.push({ tipo: 'info', clave: 'finContrato', datos: { nombres: rh.finContratos.map((x) => x.nombre).join(', ') } });
    }
    if (estado.empleados === 0) a.push({ tipo: 'alerta', clave: 'sinPersonal' });
    else if (estado.puestos < necesarios) a.push({ tipo: 'alerta', clave: 'sinPuesto' });
    if (resultado.sinAtender > 5) a.push({ tipo: 'alerta', clave: 'sinAtender', datos: { n: resultado.sinAtender } });
    if (resultado.caja < 0) a.push({ tipo: 'alerta', clave: 'cajaNegativa' });
    if (estado.empleados > 0 && resultado.ocupacion < 0.5 && resultado.sinAtender <= 5) a.push({ tipo: 'info', clave: 'ocupacionBaja' });
    if (resultado.motivacion < 0.55 && estado.empleados > 0) a.push({ tipo: 'info', clave: 'motivacionBaja' });
    resultado.adjudicats.forEach((x) => a.push({ tipo: 'bien', clave: 'adjudicat', datos: { tipus: 'enc.' + x.tipus, preu: x.preu } }));
    resultado.lliurats.forEach((x) => a.push(x.retard ? { tipo: 'alerta', clave: 'lliuratTard', datos: { tipus: 'enc.' + x.tipus, n: x.retard, x: x.descompte } } : { tipo: 'bien', clave: 'lliurat', datos: { tipus: 'enc.' + x.tipus, x: x.cobrament } }));
    resultado.endarrerits.forEach((x) => a.push({ tipo: 'alerta', clave: 'endarrerit', datos: { tipus: 'enc.' + x.tipus } }));
    resultado.acabats.forEach((x) => a.push({ tipo: 'bien', clave: 'propiAcabat', datos: { tipus: 'idea.' + x.tipus } }));
    resultado.venuts.forEach((x) => a.push({ tipo: 'bien', clave: 'propiVenut', datos: { tipus: 'idea.' + x.tipus, x: x.import } }));
    if (resultado.beneficio > 0) a.push({ tipo: 'bien', clave: 'beneficio' });
    if (a.length === 0) a.push({ tipo: 'info', clave: 'sinIncidencias' });
    return a;
  }

  return { RONDAS, SECTOR, PR, CANALES: M.CANALES, CURSOS: M.CURSOS, LABORAL: M.LABORAL, PERFILES, candidatos, minimoAceptable, nueva, projectesOberts, repartirHores, decisionesIniciales, decisionesSiguientes, cerrarRonda, clasificacion, prevision, consejo, avisos };

    secciones: [
      { titulo: '¿Qué es Simula Pime?', bloques: [
        'Simula Pime es un simulador de empresa. Vuestro equipo dirige una tienda y taller de bicicletas recién creada y compite con otras cinco empresas por los mismos clientes durante {rondas} rondas. Cada ronda equivale a un mes.',
        'La empresa empieza con {capital} de capital social, sin personal, sin puestos de trabajo y sin clientes. Todo lo demás depende de vuestras decisiones.',
      ] },
      { titulo: 'Objetivo y nota', bloques: [
        'Gana el equipo con la mejor nota media al final de la partida. Cada ronda recibís una nota de 0 a 100 que combina cinco áreas:',
        '- **Finanzas (35 %):** margen de beneficio, caja positiva y deuda razonable.',
        '- **Clientes (25 %):** parte del mercado que captáis, clientes que podéis atender y reputación.',
        '- **Equipo (20 %):** motivación de la plantilla y que esté ocupada.',

      { titulo: 'Cómo se juega una ronda', bloques: [
        '- Revisad el **Panel**: resultados de la ronda anterior, avisos y consejo de mejora.',
        '- Recorred los departamentos del menú de la izquierda y tomad sus decisiones. Cada pantalla tiene un botón «Siguiente» que os lleva a la próxima.',
        '- Mirad el resumen de la derecha: os dice cuánto dinero gastaréis y si falta algo.',
        '- En **Dirección › Cerrar la ronda** revisad todas las decisiones juntas, pulsad «Cerrar la ronda» y confirmad. Ya no se pueden cambiar.',
        '- Se calcula qué ha pasado en el mercado y volvéis al Panel con los resultados.',
        'El precio, los sueldos, la publicidad, la calidad, la sostenibilidad y las horas de los proyectos abiertos se mantienen de una ronda a otra hasta que los cambiéis. Contratar, despedir, dar formación, comprar puestos, presentar presupuestos, empezar o vender proyectos propios y pedir o devolver préstamos se hacen solo una vez.',

      { titulo: 'El menú y los departamentos', bloques: [
        'El menú de la izquierda está organizado como los departamentos de una empresa:',
        '- **Dirección.** Panel con los resultados de la última ronda, Clasificación de las seis empresas y Cerrar la ronda.',

        '- **Sostenibilidad.** Medidas sostenibles.',
        '- **Ayuda.** Este manual.',
        'En el móvil, el menú se abre con el botón «Menú». La herramienta se abre en catalán; los botones ES y CA cambian el idioma. La partida se guarda en el navegador: si cerráis la página y volvéis desde el mismo dispositivo, continúa donde la dejasteis.',
      ] },
      { titulo: 'Las decisiones de cada departamento', bloques: [
        '**Comercial y marketing › Precio.** Lo que cobráis de media a cada cliente. El precio medio del sector es {precio} y atender a un cliente cuesta unos {coste} en materiales. Un precio bajo atrae más clientes pero deja menos margen; uno alto atrae menos, sobre todo si la reputación es baja.',
        '**Comercial y marketing › Publicidad.** Cinco canales con cuatro niveles cada uno. La publicidad no funciona al instante: lo que se conoce de vuestra empresa es una mezcla de lo invertido esta ronda y en las anteriores. Usar varios canales a la vez da un extra de alcance, y cada nivel más alto de un mismo canal rinde menos que el anterior.',
        '**Comercial y marketing › Presupuestos.** Precio que pedís por los encargos de clientes. Se explica más abajo, en «Encargos de clientes».',
        '**Recursos humanos.** Aquí se contrata, se ajustan los sueldos, se da formación y se despide. Una persona a jornada completa con puesto de trabajo aporta {horasPersona} horas por ronda; si las dedica a la tienda, con habilidad normal y bien motivada, atiende unos {clientesEmpleado} clientes. A la empresa cada sueldo le cuesta un 53 % más por las cotizaciones a la Seguridad Social. Más abajo hay una sección entera dedicada a este departamento.',
        '**Producción › Puestos de trabajo.** Cada puesto equipado cuesta {puesto} y da para una jornada completa: dos medias jornadas pueden compartirlo. Si faltan puestos, la plantilla cobra pero solo puede trabajar la parte que le permiten los puestos. Los puestos son inmovilizado: aparecen en el balance y pierden valor cada ronda (amortización).',
        '**Producción › Calidad.** La inversión en calidad y atención al cliente mejora la reputación: los clientes satisfechos vuelven y os recomiendan. A partir de 1.500 € por ronda ya no aporta más.',
        '**Producción › Horas de trabajo.** Reparto de las horas de la plantilla entre encargos, proyectos propios y tienda. Se explica más abajo.',
        '**Innovación (I+D) › Proyectos propios.** Ideas que podéis desarrollar y después vender o mantener. Se explica más abajo.',
        '**Finanzas › Banco.** Podéis pedir un préstamo al 7 % de interés anual. El banco presta como máximo el 80 % del patrimonio de la empresa menos lo que ya debéis. Si la caja queda en negativo, el descubierto se paga al 28 % anual.',
        '**Sostenibilidad › Medidas sostenibles.** Reciclaje de piezas y neumáticos, energía renovable en el taller, reparto en bicicleta… Sube la nota de sostenibilidad y atrae a algunos clientes. A partir de 1.000 € por ronda ya no aporta más.',
      ] },
      { titulo: 'Recursos humanos', bloques: [
        'El departamento de **Recursos humanos** tiene tres pantallas. Arriba siempre veis cuántas personas tenéis, cuántas jornadas completas suman y si os faltan puestos de trabajo.',
        '**Selección de personal.** Cada mes llegan seis currículums nuevos, más dos del mes anterior que todavía buscan trabajo. Cada candidatura indica edad, estudios, experiencia, jornada que pide (completa, 30 h o media jornada), sueldo que pide, puntos fuertes, puntos a tener en cuenta y la nota de la entrevista. La entrevista da una idea de lo bien que trabajará la persona, pero no es exacta. Podéis ofrecer un sueldo algo más bajo del que pide, pero no aceptará menos de un 92 %. Contratar cuesta 300 € de alta, y el primer mes cada persona rinde un 15 % menos mientras aprende cómo funciona la tienda.',
        '**Plantilla.** Para cada persona podéis cambiar el sueldo, elegir un curso para este mes o despedirla. Despedir cuesta una indemnización de mes y medio de sueldo y baja la motivación del resto. Hay dos cursos:',
        '- **Mecánica avanzada (200 €):** sube el rendimiento de la persona un 4 % para siempre (hasta un 20 %), pero ocupa una cuarta parte de su tiempo ese mes.',
        '- **Atención al cliente (150 €):** mejora la reputación de la tienda, y ocupa un 15 % de su tiempo ese mes. Algunas personas ya llegan con buena atención al cliente.',
        '**Motivación.** Cada persona compara lo que cobra con lo que esperaba cobrar. Si cobra menos, se desmotiva y rinde menos; si cobra más, se motiva. Dar formación motiva un poco; despedir a alguien y no dar abasto con los clientes desmotiva. Si la motivación de alguien baja de 40, se va de la empresa a final de mes (baja voluntaria).',
        '**Contratos.** Al contratar elegís el tipo de contrato. El **indefinido** da más seguridad y motivación; despedir cuesta mes y medio de sueldo. El **temporal** dura 3 meses y motiva algo menos: si al llegar al último mes no lo hacéis indefinido, la persona se va al acabar la ronda y se le pagan 12 días de sueldo por año trabajado. Despedir a un temporal antes de tiempo cuesta medio mes de sueldo. Pasar un temporal a indefinido le sube la motivación.',
        '**Prevención de riesgos laborales (PRL).** La formación en PRL es obligatoria por ley. Cuesta 60 € y ocupa un 5 % del tiempo de un mes. Cada mes hay riesgo de accidente laboral: sin PRL es de un 7 % por persona y con PRL baja a un 1,5 %. Quien se accidenta trabaja medio mes y pierde motivación, y si no tenía la formación, Inspección de Trabajo pone una multa de 1.500 €.',
        '**Vacaciones.** Cada persona genera 2,5 días de vacaciones al mes. Con 10 días acumulados puede hacer dos semanas de vacaciones: ese mes trabaja la mitad, pero vuelve más motivada. Si acumula 20 días o más sin hacerlas, se cansa y se desmotiva.',
        '**Bajas por enfermedad.** Cada mes, cada persona tiene un 4 % de probabilidad de ponerse enferma y faltar medio mes. La empresa sigue pagando el sueldo. No se puede evitar, pero conviene tener algo de margen en la plantilla.',
        '**Nómina.** En la Plantilla, el botón «Ver la nómina» muestra la nómina orientativa de cada persona: salario bruto, cotización a la Seguridad Social (6,5 %) y retención de IRPF del trabajador, líquido a percibir, Seguridad Social a cargo de la empresa y coste total. El coste total es el mismo que se apunta en la contabilidad como gasto de personal.',
        '**Análisis del rendimiento.** Después de cada ronda veréis los indicadores del equipo (personas, gasto de personal, clientes por persona, motivación media y rotación), una tabla con el rendimiento, los clientes, las ventas, el coste, la aportación y las incidencias (vacaciones, bajas, accidentes, formación) de cada persona, un gráfico de aportaciones, recomendaciones y la evolución del equipo. La aportación es lo que ha vendido esa persona menos los materiales y lo que cuesta a la empresa.',

// Valores del sector que se insertan en el texto del manual, ya con formato de euros.
ManualSimula.variables = function (sector, rondas, pr) {
  var eur = function (n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ' €'; };
  return {
    capital: eur(sector.capitalInicial), rondas: String(rondas), precio: eur(sector.precioReferencia), coste: eur(sector.costeVariable),
    salario: eur(sector.salarioMercado), clientesEmpleado: String(sector.clientesPorEmpleado), puesto: eur(sector.costePuesto), fijos: eur(sector.gastosFijos),
    horasPersona: String(pr.HORES_PERSONA), vidaIdea: String(pr.VIDA_IDEA),
  };
};

if (typeof module !== 'undefined' && module.exports) module.exports = ManualSimula;

    horas: function (e, sec) {

  // Pantalla de cierre: todas las decisiones de la ronda en una tabla, con acceso directo a cada una.
  function vistaCierre() {

    var d = S.dec, niveles = t('niveles'), r = asegurarRrhh();
    var canales = Object.keys(P.CANALES).filter(function (c) { return d.marketing[c] > 0; }).map(function (c) { return t('canal.' + c) + ': ' + niveles[d.marketing[c]]; });

    var totsPropis = e.idees.concat(e.propis);

  function jornadaTxt(j) { return t('jornada.' + Math.round(j * 100)); }

  function costeEmpresa(sueldo) { return Math.round(sueldo * P.SECTOR.costeSalarialFactor); }

  // Nómina orientativa a partir del sueldo neto: se busca el bruto que, tras Seguridad Social e IRPF, deja ese neto.
  // El coste total coincide con el que usa el simulador (neto + 53 %).
  function nomina(neto) {
    var ss = 0.065, irpf = 0.02, bruto = neto;
    for (var i = 0; i < 6; i++) {
      bruto = neto / (1 - ss - irpf);
      var anual = bruto * 12;
      irpf = anual < 15000 ? 0 : anual < 18000 ? 0.04 : anual < 22000 ? 0.08 : anual < 28000 ? 0.12 : anual < 35000 ? 0.15 : 0.18;
    }
    bruto = Math.round(neto / (1 - ss - irpf));
    var cuotaSs = Math.round(bruto * ss), cuotaIrpf = bruto - cuotaSs - neto, coste = costeEmpresa(neto);
    return { bruto: bruto, ss: cuotaSs, irpf: cuotaIrpf, irpfPct: irpf, neto: neto, ssEmpresa: coste - bruto, coste: coste };
  }

  document.addEventListener('click', function (ev) {

    if (!b) return;
    if (b.hasAttribute('data-idioma')) {
      S.idioma = b.getAttribute('data-idioma');
      try { localStorage.setItem(CLAVE_IDIOMA, S.idioma); } catch (e) {}
      pintar(); return;
    }
    if (b.hasAttribute('data-vista')) {
      S.vista = b.getAttribute('data-vista'); S.confirmando = false; S.reinicio = false; S.menu = false; pintar(); window.scrollTo(0, 0);
      var h1 = document.querySelector('#vista h1'); if (h1) { h1.setAttribute('tabindex', '-1'); h1.focus({ preventScroll: true }); }
      return;

    if (b.hasAttribute('data-contratar')) {
      if (b.disabled) return;
      var id = b.getAttribute('data-contratar'), r = asegurarRrhh();
      P.candidatos(S.partida).forEach(function (c) {
        var oferta = S.ofertas[id] !== undefined ? S.ofertas[id] : c.deseado;
        if (c.id === id && oferta >= P.minimoAceptable(c)) r.contratar.push(Object.assign({}, c, { salario: Math.round(oferta), contrato: S.contratos[id] || 'indefinido' }));
      });
      S.confirmando = false; guardar(); pintar(); return;
    }
    if (b.hasAttribute('data-contrato-cand')) { S.contratos[b.getAttribute('data-contrato-cand')] = b.getAttribute('data-tipo'); pintar(); return; }
    if (b.hasAttribute('data-nomina')) { var idn = b.getAttribute('data-nomina'); S.nomina = S.nomina === idn ? null : idn; pintar(); return; }
    if (b.hasAttribute('data-convertir')) {
      var rv = asegurarRrhh(), idv = b.getAttribute('data-convertir');
      rv.convertir = rv.convertir.indexOf(idv) >= 0 ? rv.convertir.filter(function (x) { return x !== idv; }) : rv.convertir.concat([idv]);
      S.confirmando = false; guardar(); pintar(); return;
    }
    if (b.hasAttribute('data-deshacer-contratar')) {
      var idc = b.getAttribute('data-deshacer-contratar'), rc = asegurarRrhh();
      rc.contratar = rc.contratar.filter(function (x) { return x.id !== idc; });
      S.confirmando = false; guardar(); pintar(); return;
    }
    if (b.hasAttribute('data-despedir')) {
      var rd = asegurarRrhh(), idd = b.getAttribute('data-despedir');
      if (rd.despedir.indexOf(idd) < 0) rd.despedir.push(idd);
      delete rd.cursos[idd]; delete rd.salarios[idd];
      S.confirmando = false; guardar(); pintar(); return;
    }
    if (b.hasAttribute('data-deshacer-despedir')) {
      var ru = asegurarRrhh(), idu = b.getAttribute('data-deshacer-despedir');
      ru.despedir = ru.despedir.filter(function (x) { return x !== idu; });
      S.confirmando = false; guardar(); pintar(); return;
    }
    if (b.hasAttribute('data-curso')) {
      var rk = asegurarRrhh(), idk = b.getAttribute('data-curso'), tipo = b.getAttribute('data-tipo');
      if (tipo) rk.cursos[idk] = tipo; else delete rk.cursos[idk];
      S.confirmando = false; guardar(); pintar(); return;
    }
    if (b.hasAttribute('data-iniciar') || b.hasAttribute('data-vendre')) {
      var llista = b.hasAttribute('data-iniciar') ? S.dec.iniciar : S.dec.vendre;
      var id = b.getAttribute(b.hasAttribute('data-iniciar') ? 'data-iniciar' : 'data-vendre');
      var pos = llista.indexOf(id);
      if (pos >= 0) { llista.splice(pos, 1); if (S.dec.hores[id]) delete S.dec.hores[id]; } else llista.push(id);
      S.confirmando = false; guardar(); pintar(); return;
    }
    if (b.hasAttribute('data-ronda-conta')) { S.rondaConta = Number(b.getAttribute('data-ronda-conta')); pintar(); return; }
    if (b.hasAttribute('data-canal')) {
      S.dec.marketing[b.getAttribute('data-canal')] = Number(b.getAttribute('data-nivel'));
      var hermanos = b.parentNode.querySelectorAll('button');
      for (var i = 0; i < hermanos.length; i++) hermanos[i].setAttribute('aria-pressed', String(hermanos[i] === b));
      S.confirmando = false; guardar(); pintarResumen(); return;
    }
    var accion = b.getAttribute('data-accion');
    if (accion === 'menu') { S.menu = !S.menu; pintar(); }
    else if (accion === 'auto-hores') { S.dec.hores = P.repartirHores(yo().estado, S.dec); S.confirmando = false; guardar(); pintar(); }
    else if (accion === 'cerrar') { S.confirmando = true; pintarResumen(); }
    else if (accion === 'cancelar') { S.confirmando = false; pintarResumen(); }
    else if (accion === 'confirmar') {
      S.partida = P.cerrarRonda(S.partida, S.dec);
      S.dec = P.decisionesSiguientes(S.dec, S.partida.equipos[0].estado);
      S.confirmando = false; S.rondaConta = null; S.ofertas = {}; S.contratos = {}; S.nomina = null; S.vista = 'panel'; guardar(); pintar(); window.scrollTo(0, 0);
    }
    else if (accion === 'reiniciar') { S.reinicio = true; pintar(); }
    else if (accion === 'reiniciar-no') { S.reinicio = false; pintar(); }
    else if (accion === 'reiniciar-si') { S = estadoNuevo(S.idioma); guardar(); pintar(); window.scrollTo(0, 0); }
  });

  // Casillas de Recursos humanos: solo se actualizan los textos de al lado, para no perder el foco al escribir.
  function alCambiarRrhh(ev) {
    var c = ev.target;
    if (!c.getAttribute) return false;
    var n = Number(c.value); n = isFinite(n) && n > 0 ? Math.round(n) : 0;
    if (c.hasAttribute('data-vacaciones')) {
      if (ev.type !== 'change') return true;
      var rq = asegurarRrhh(), idq = c.getAttribute('data-vacaciones');
      rq.vacaciones = rq.vacaciones.filter(function (x) { return x !== idq; });
      if (c.checked) rq.vacaciones.push(idq);
      S.confirmando = false; guardar(); pintar(); return true;
    }
    if (c.hasAttribute('data-oferta')) {
      var id = c.getAttribute('data-oferta'); S.ofertas[id] = n;
      var cand = null; P.candidatos(S.partida).forEach(function (x) { if (x.id === id) cand = x; });
      if (!cand) return true;
      var minimo = P.minimoAceptable(cand), bajo = n < minimo, info = document.getElementById('info-' + id), boton = document.querySelector('[data-contratar="' + id + '"]');
      if (boton) boton.disabled = bajo;
      if (info) { info.className = 'mini' + (bajo ? ' mal' : ' gris'); info.textContent = bajo ? t('cand.minimo', { x: eur(minimo) }) : t('cand.coste', { x: eur(costeEmpresa(n)) }); }
      return true;
    }
    if (c.hasAttribute('data-sueldo')) {
      var ids = c.getAttribute('data-sueldo'), r = asegurarRrhh(), emp = null;
      yo().estado.plantilla.forEach(function (x) { if (x.id === ids) emp = x; });
      if (n > 0) r.salarios[ids] = n; else delete r.salarios[ids];
      var cs = document.getElementById('cs-' + ids);
      if (cs && emp) cs.textContent = t('pla.pide', { x: eur(emp.deseado) }) + ' · ' + t('pla.coste', { x: eur(costeEmpresa(n)) });
      S.confirmando = false; guardar();
      if (ev.type === 'change') { var res = document.getElementById('rrhh-resumen'); if (res) res.outerHTML = resumenRrhh(); }
      return true;
    }
    return false;
  }

  function alCambiar(ev) {
    var c = ev.target;
    if (alCambiarRrhh(ev)) return;
    if (c.getAttribute && (c.hasAttribute('data-pressupost') || c.hasAttribute('data-hores'))) {
      if (ev.type === 'change') return;
      var n0 = Number(c.value), val = isFinite(n0) && n0 > 0 ? n0 : 0;
      if (c.hasAttribute('data-pressupost')) {
        var sid = c.getAttribute('data-pressupost');
        S.dec.ofertes[sid] = val;
        var sol = S.partida.sollicituds.filter(function (x) { return x.id === sid; })[0];
        var m = document.getElementById('m-' + sid); if (m && sol) m.textContent = textoMarge(sol, val);
      } else S.dec.hores[c.getAttribute('data-hores')] = val;
      S.confirmando = false; guardar(); pintarResumen(); return;
    }
    if (!c.getAttribute || !c.hasAttribute('data-campo')) return;
    // Al salir de una casilla el navegador repite el aviso de cambio; si se repintara el resumen en ese momento,
    // el botón que se estaba pulsando desaparecería bajo el dedo y el clic se perdería.
    if (ev.type === 'change' && c.type !== 'checkbox') return;
    var id = c.getAttribute('data-campo');
    if (id === 'formacion') S.dec.formacion = c.checked;
    else { var n = Number(c.value); S.dec[id] = isFinite(n) && n > 0 ? n : 0; }
    S.confirmando = false; guardar(); pintarResumen();
  }
  document.addEventListener('input', alCambiar);
  document.addEventListener('change', alCambiar);

  function arrancar(datos) {
    // Una partida de la versión anterior no tiene contabilidad: se empieza de nuevo.
    var valida = datos && datos.partida && datos.dec && datos.partida.sollicituds && datos.dec.ofertes && datos.partida.equipos && Array.isArray(datos.partida.equipos[0].estado.plantilla) && datos.partida.equipos[0].historial.every(function (x) { return x.contabilidad; });
    if (valida) {
      S = estadoNuevo(datos.idioma); S.partida = datos.partida; S.dec = datos.dec; S.vista = datos.vista || 'panel';
    } else {
      S = cargar() || estadoNuevo();
    }
    pintar();
  }
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(function () { return { partida: S.partida, dec: S.dec, vista: S.vista, idioma: S.idioma }; });
  if (hot && hot.ready) hot.ready(arrancar); else arrancar((hot && hot.data) || {});
})();
</script>
